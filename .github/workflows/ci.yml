# Minimale CI (Sprintplan 2.3): Build, statische Tests, Lint, Compose-Validierung.
# Die Live-Suite (tests/run.js --live) braucht den laufenden Stack und bleibt lokal.
name: CI
on:
  push:
    branches: [main]
  pull_request:

# Fork-PRs bekommen von GitHub ohnehin nur ein Lese-Token. Hier trotzdem
# explizit, damit ein Umstellen der Repo-Vorgabe (Settings → Actions →
# Workflow permissions) diesen Workflow nicht stillschweigend aufwertet.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Abhängigkeiten
        run: npm --prefix gui ci
      - name: Lint
        run: npm --prefix gui run lint
      - name: Statische Tests
        run: node tests/run.js
      - name: GUI-Build
        run: npm --prefix gui run build
      - name: Compose validieren
        # Die Passwörter sind Pflichtvariablen (${VAR:?…}); ohne Werte bricht schon
        # die Syntaxprüfung ab. .env.example liefert bewusst KEINE Vorgabewerte
        # (sonst landen sie in echten Installationen), deshalb erzeugt die CI hier
        # Wegwerfwerte. Es werden keine Container gestartet.
        run: |
          cp platform/.env.example platform/.env
          sed -i 's/^\([A-Z_]*\(USER\|ADMIN\)\)=$/\1=ci/;
                  s/^\([A-Z_]*\(PASSWORD\|SECRET_KEY\)\)=$/\1=ci-throwaway-not-a-secret/' \
              platform/.env
          docker compose -f platform/docker-compose.yml --env-file platform/.env config -q
      - name: SSG-Generatoren laufen
        # -I'"stand":' ignoriert das Zeitstempelfeld in connectors-status.json:
        # Es wird aus der Registry-mtime abgeleitet, die ein frischer Klon auf die
        # Checkout-Zeit setzt — sonst warnte der Schritt bei JEDEM Lauf und eine
        # echte Drift ginge im Dauerrauschen unter.
        run: |
          python3 scripts/generate-city-pages.py
          python3 scripts/export-connector-status.py
          git diff --stat --exit-code -I'"stand":' gui/public/connectors-status.json gui/ops/connectors-status.json gui/public/g \
            || echo "::warning::Generierte Artefakte weichen vom Generator-Stand ab — generate-city-pages.py bzw. export-connector-status.py laufen lassen und committen"

  # The admin panel builds and runs on Node 24 (Argon2 in node:crypto). Its unit
  # tests run a real PostgreSQL in-process (PGlite), no service container needed.
  admin:
    runs-on: ubuntu-latest
    services:
      # Real concurrency for the race tests (PGlite has a single connection).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udp_admin
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
          POSTGRES_DB: udp_admin
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U udp_admin -d udp_admin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/admin/package-lock.json
      - name: Dependencies
        run: npm --prefix platform/admin ci
      - name: Lint
        run: npm --prefix platform/admin run lint
      - name: Svelte check
        run: npm --prefix platform/admin run check
      - name: Unit tests
        run: npm --prefix platform/admin test
      - name: Build
        run: npm --prefix platform/admin run build
      - name: Integration tests (real PostgreSQL, built server)
        env:
          ADMIN_TEST_DB_PASSWORD: ci-throwaway-not-a-secret
        run: npm --prefix platform/admin run test:integration
      - name: Static tests incl. hardening proof
        # Like the connectors job: the proof skips itself without node_modules.
        run: node tests/run.js

  # A separate job instead of extra steps in build-test: the connector service
  # needs Node 22 (package.json: engines), the cockpit SPA builds on 24
  # (gui/Dockerfile). A second setup-node in the same job would switch the Node
  # version for every step that follows — that belongs apart.
  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/connectors/package-lock.json
      - name: Dependencies
        run: npm --prefix platform/connectors ci
      - name: Typecheck
        run: npm --prefix platform/connectors run typecheck
      - name: Lint
        run: npm --prefix platform/connectors run lint
      - name: Formatting
        run: npm --prefix platform/connectors run format:check
      - name: Build
        # From a clean dist: a stale compiled test file must not keep running
        # (or keep the parity count up) after its source is gone.
        run: |
          rm -rf platform/connectors/dist
          npm --prefix platform/connectors run build
      - name: Static tests incl. hardening proof
        # Runs a second time here, and that is deliberate: tests/static/
        # type-discipline.test.js calls the service's tsc and eslint and skips
        # itself without its node_modules. In build-test (without an install)
        # the proof is therefore skipped — only here does it really take hold.
        # Incidentally, the run over there shows that the suite still passes
        # dependency-free on a fresh clone. REQUIRE_PARITY: here the parity
        # suite must be there — a missing build fails instead of being skipped.
        env:
          REQUIRE_PARITY: "1"
        run: node tests/run.js
