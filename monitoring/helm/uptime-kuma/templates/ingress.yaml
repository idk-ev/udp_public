{{- if .Values.ingress.enabled }}
# =============================================================================
# Statusseite / Weboberflaeche
#
# Uptime Kuma richtet sein Administratorkonto beim ERSTEN Aufruf im Browser
# ein – wer zuerst kommt, bekommt es. Vor dem Veroeffentlichen also entweder
# das Konto anlegen (Port-Forward) oder am Ingress-Controller BasicAuth/
# IP-Allowlist davorschalten.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "uptime-kuma.fullname" . }}
  labels:
    {{- include "uptime-kuma.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "uptime-kuma.fullname" . }}
                port: { number: {{ .Values.service.port }} }
{{- end }}
