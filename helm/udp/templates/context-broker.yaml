# =============================================================================
# Kontextverwaltung: Orion-LD (NGSI-LD) + Mintaka (Temporal API)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-ld
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "orion-ld") | nindent 4 }}
spec:
  replicas: {{ .Values.orionLd.replicas }}
  selector:
    matchLabels:
      {{- include "udp.selectorLabels" "orion-ld" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "udp.podLabels" (dict "ctx" . "component" "orion-ld") | nindent 8 }}
    spec:
      {{- include "udp.podSpec" (dict "ctx" . "cfg" .Values.orionLd) | nindent 6 }}
      {{- include "udp.spread" (dict "component" "orion-ld" "cfg" .Values.orionLd) | nindent 6 }}
      containers:
        - name: orion-ld
          image: {{ include "udp.image" (dict "ctx" . "image" .Values.orionLd.image) }}
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" .Values.orionLd.containerSecurityContext) | nindent 12 }}
          args:
            - -dbhost
            - mongo
            - -logLevel
            - WARN
            - -forwarding
            - -troe
            - -troeHost
            - timescale
            - -troeUser
            - $(POSTGRES_USER)
            - -troePwd
            - $(POSTGRES_PASSWORD)
            # Idle timeout + connection cap keep the process below FD_SETSIZE
            # (s. orionLd.reqTimeout in values.yaml).
            - -reqTimeout
            - {{ .Values.orionLd.reqTimeout | quote }}
            - -maxConnections
            - {{ .Values.orionLd.maxConnections | quote }}
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 1026 }]
          resources:
            {{- toYaml .Values.orionLd.resources | nindent 12 }}
          {{- include "udp.probes" .Values.orionLd.probes | nindent 10 }}
          {{- include "udp.preStopSleep" 5 | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-ld
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "orion-ld") | nindent 4 }}
spec:
  selector:
    {{- include "udp.selectorLabels" "orion-ld" | nindent 4 }}
  ports: [{ port: 1026 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mintaka
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mintaka") | nindent 4 }}
spec:
  replicas: {{ .Values.mintaka.replicas }}
  selector:
    matchLabels:
      {{- include "udp.selectorLabels" "mintaka" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "udp.podLabels" (dict "ctx" . "component" "mintaka") | nindent 8 }}
    spec:
      {{- include "udp.podSpec" (dict "ctx" . "cfg" .Values.mintaka) | nindent 6 }}
      {{- include "udp.spread" (dict "component" "mintaka" "cfg" .Values.mintaka) | nindent 6 }}
      containers:
        - name: mintaka
          image: {{ include "udp.image" (dict "ctx" . "image" .Values.mintaka.image) }}
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" .Values.mintaka.containerSecurityContext) | nindent 12 }}
          env:
            - { name: DATASOURCES_DEFAULT_HOST, value: timescale }
            - { name: DATASOURCES_DEFAULT_PORT, value: "5432" }
            - { name: DATASOURCES_DEFAULT_DATABASE, value: {{ .Values.timescale.db.name | quote }} }
            - name: DATASOURCES_DEFAULT_USERNAME
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_USER } }
            - name: DATASOURCES_DEFAULT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
            - { name: ENDPOINTS_ALL_PORT, value: "8080" }
            - { name: MICRONAUT_METRICS_ENABLED, value: "false" }  # JDK-cgroup-Bug-Workaround
            # Explicit -Xmx: with container support disabled the JVM would size
            # its heap from the node's memory (s. mintaka.javaOpts).
            - { name: JAVA_TOOL_OPTIONS, value: {{ .Values.mintaka.javaOpts | quote }} }
          ports: [{ containerPort: 8080 }]
          resources:
            {{- toYaml .Values.mintaka.resources | nindent 12 }}
          {{- include "udp.probes" .Values.mintaka.probes | nindent 10 }}
          {{- include "udp.preStopSleep" 5 | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mintaka
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mintaka") | nindent 4 }}
spec:
  selector:
    {{- include "udp.selectorLabels" "mintaka" | nindent 4 }}
  ports: [{ port: 8080 }]
