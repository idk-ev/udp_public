# =============================================================================
# Kontextverwaltung: Orion-LD (NGSI-LD) + Mintaka (Temporal API)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-ld
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "orion-ld") | nindent 4 }}
spec:
  replicas: {{ .Values.orionLd.replicas }}
  minReadySeconds: {{ .Values.orionLd.minReadySeconds | default 0 }}
  {{- include "udp.rollingUpdate" (dict "ctx" . "cfg" .Values.orionLd) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "udp.selectorLabels" "orion-ld" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "udp.podLabels" (dict "ctx" . "component" "orion-ld") | nindent 8 }}
      {{- if .Values.orionLd.troeSchema }}
      annotations:
        # A changed schema script runs on the next start of each replica.
        checksum/troe-schema: {{ .Files.Get "files/postgres/troe-schema.sql" | sha256sum }}
      {{- end }}
    spec:
      {{- include "udp.podSpec" (dict "ctx" . "cfg" .Values.orionLd) | nindent 6 }}
      {{- include "udp.spread" (dict "ctx" . "component" "orion-ld" "cfg" .Values.orionLd) | nindent 6 }}
      {{- if or .Values.orionLd.waitForDatabases .Values.orionLd.troeSchema }}
      initContainers:
      {{- end }}
      {{- if .Values.orionLd.waitForDatabases }}
        # Same image (has bash with /dev/tcp) – no extra image to pull.
        # Each entry is a space-separated list of alternatives: one reachable
        # replica set member is enough.
        - name: wait-for-databases
          image: {{ include "udp.image" (dict "ctx" . "image" .Values.orionLd.image) }}
          env:
            - name: MONGO_TARGETS
              value: {{ ternary (include "udp.mongoMembers" . | replace "," " ") "mongo:27017" .Values.mongo.replicaSet.enabled | quote }}
          command:
            - bash
            - -c
            - |
              reachable() {
                for target in $1; do
                  timeout 2 bash -c "echo > /dev/tcp/${target%:*}/${target#*:}" 2>/dev/null && return 0
                done
                return 1
              }
              for targets in "$MONGO_TARGETS" timescale:5432; do
                until reachable "$targets"; do
                  echo "waiting for $targets"; sleep 2
                done
              done
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" .Values.orionLd.containerSecurityContext) | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      {{- end }}
      {{- if .Values.orionLd.troeSchema }}
        # TRoE schema before the broker starts (files/postgres/troe-schema.sql):
        # attributes as a hypertable without primary key; Orion-LD's own DDL
        # then aborts harmlessly. Idempotent, serialised by an advisory lock,
        # a no-op on an existing database. The database image brings psql.
        - name: troe-schema
          image: {{ include "udp.ownImage" (dict "ctx" . "image" .Values.timescale.image) }}
          {{- /* A digest never changes its content: no registry round trip, so
               a registry outage does not block a restart of the broker. */}}
          {{- if contains "@sha256:" (.Values.timescale.image.tag | default .Values.global.udpTag | toString) }}
          imagePullPolicy: IfNotPresent
          {{- else }}
          {{ include "udp.ownImagePullPolicy" . }}
          {{- end }}
          env:
            - { name: PGHOST, value: timescale }
            - { name: PGDATABASE, value: {{ .Values.timescale.db.name | quote }} }
            - { name: PGCONNECT_TIMEOUT, value: "5" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
          # The database (a CNPG Database resource) may appear a moment after
          # the port: retry for up to 5 min, then let the kubelet restart it.
          command:
            - bash
            - -c
            - |
              for i in $(seq 1 60); do
                psql -X -q -v ON_ERROR_STOP=1 -f /troe/troe-schema.sql && exit 0
                echo "troe-schema: attempt $i failed, retrying in 5 s"; sleep 5
              done
              exit 1
          volumeMounts:
            - { name: troe-schema, mountPath: /troe, readOnly: true }
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" (dict "runAsNonRoot" true "runAsUser" 26 "readOnlyRootFilesystem" true)) | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      {{- end }}
      {{- if .Values.orionLd.troeSchema }}
      volumes:
        - name: troe-schema
          configMap: { name: troe-schema }
      {{- end }}
      containers:
        - name: orion-ld
          image: {{ include "udp.image" (dict "ctx" . "image" .Values.orionLd.image) }}
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" .Values.orionLd.containerSecurityContext) | nindent 12 }}
          args:
            {{- if .Values.mongo.replicaSet.enabled }}
            # Orion-LD 1.6 talks to MongoDB through TWO drivers: the legacy
            # C++ driver only knows -dbhost (comma-separated seed list) plus
            # -rplSet, the mongoc driver takes -dbURI as is (it would build
            # the same URI from -dbhost/-rplSet, with a trailing "&").
            - -dbhost
            - {{ include "udp.mongoMembers" . | quote }}
            - -rplSet
            - {{ .Values.mongo.replicaSet.name | quote }}
            - -dbURI
            - {{ include "udp.mongoUri" (dict "ctx" . "db" "") | quote }}
            {{- else }}
            - -dbhost
            - mongo
            {{- end }}
            - -logLevel
            - WARN
            - -forwarding
            - -troe
            - -troeHost
            - timescale
            - -troeUser
            - $(POSTGRES_USER)
            - -troePwd
            - $(POSTGRES_PASSWORD)
            # Idle timeout + connection cap keep the process below FD_SETSIZE
            # (s. orionLd.reqTimeout in values.yaml).
            - -reqTimeout
            - {{ .Values.orionLd.reqTimeout | quote }}
            - -maxConnections
            - {{ .Values.orionLd.maxConnections | quote }}
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 1026 }]
          resources:
            {{- toYaml .Values.orionLd.resources | nindent 12 }}
          {{- include "udp.probes" .Values.orionLd.probes | nindent 10 }}
          {{- include "udp.preStopSleep" 5 | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-ld
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "orion-ld") | nindent 4 }}
spec:
  selector:
    {{- include "udp.selectorLabels" "orion-ld" | nindent 4 }}
  ports: [{ port: 1026 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mintaka
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mintaka") | nindent 4 }}
spec:
  replicas: {{ .Values.mintaka.replicas }}
  minReadySeconds: {{ .Values.mintaka.minReadySeconds | default 0 }}
  {{- include "udp.rollingUpdate" (dict "ctx" . "cfg" .Values.mintaka) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "udp.selectorLabels" "mintaka" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "udp.podLabels" (dict "ctx" . "component" "mintaka") | nindent 8 }}
    spec:
      {{- include "udp.podSpec" (dict "ctx" . "cfg" .Values.mintaka) | nindent 6 }}
      {{- include "udp.spread" (dict "ctx" . "component" "mintaka" "cfg" .Values.mintaka) | nindent 6 }}
      containers:
        - name: mintaka
          image: {{ include "udp.image" (dict "ctx" . "image" .Values.mintaka.image) }}
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" .Values.mintaka.containerSecurityContext) | nindent 12 }}
          env:
            - { name: DATASOURCES_DEFAULT_HOST, value: timescale }
            - { name: DATASOURCES_DEFAULT_PORT, value: "5432" }
            - { name: DATASOURCES_DEFAULT_DATABASE, value: {{ .Values.timescale.db.name | quote }} }
            - name: DATASOURCES_DEFAULT_USERNAME
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_USER } }
            - name: DATASOURCES_DEFAULT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udp.dbSecretName" . }}, key: POSTGRES_PASSWORD } }
            - { name: ENDPOINTS_ALL_PORT, value: "8080" }
            - { name: MICRONAUT_METRICS_ENABLED, value: "false" }  # JDK-cgroup-Bug-Workaround
            {{- with .Values.mintaka.statementTimeout | toString | trim }}
            {{- if not (regexMatch "^[0-9]+(ms|s|min)?$" .) }}
            {{- fail (printf "mintaka.statementTimeout: %q must be a PostgreSQL duration like 30s, 500ms or 2min" .) }}
            {{- end }}
            # Upper bound per query (s. mintaka.statementTimeout), run on every
            # new pooled connection.
            - { name: DATASOURCES_DEFAULT_CONNECTION_INIT_SQL, value: {{ printf "SET statement_timeout = '%s'" . | quote }} }
            {{- end }}
            # Explicit -Xmx: with container support disabled the JVM would size
            # its heap from the node's memory (s. mintaka.javaOpts).
            - { name: JAVA_TOOL_OPTIONS, value: {{ .Values.mintaka.javaOpts | quote }} }
          ports: [{ containerPort: 8080 }]
          resources:
            {{- toYaml .Values.mintaka.resources | nindent 12 }}
          {{- include "udp.probes" .Values.mintaka.probes | nindent 10 }}
          {{- include "udp.preStopSleep" 5 | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mintaka
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mintaka") | nindent 4 }}
spec:
  selector:
    {{- include "udp.selectorLabels" "mintaka" | nindent 4 }}
  ports: [{ port: 8080 }]
