  {{- $ckanPass = index $existingCkan.data "CKAN_SYSADMIN_PASSWORD" | b64dec }}
{{- else if .Values.ckan.adminPassword }}
  {{- $ckanPass = .Values.ckan.adminPassword }}
{{- else }}
  {{- $ckanPass = randAlphaNum (.Values.secrets.passwordLength | int) }}
{{- end }}
---
apiVersion: v1
