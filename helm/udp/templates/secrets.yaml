{{- /*
Vom Chart verwaltete Secrets. Werden NUR erzeugt, wenn secrets.create=true
und kein existingSecret gesetzt ist. Passwörter, die in values leer sind,
werden beim ersten Install zufällig generiert und über 'lookup' bei Upgrades
stabil gehalten (kein Passwort-Wechsel bei jedem helm upgrade).

Hinweis Sicherheit: Helm legt gerenderte Manifeste als Release-Secret im
Cluster ab. Für höchste Anforderungen secrets.create=false setzen und
SealedSecrets / External-Secrets-Operator / Vault verwenden.
*/ -}}

{{- if and .Values.secrets.create (not .Values.db.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "udp-db" }}
{{- $dbPass := "" }}
{{- if and $existing $existing.data (index $existing.data "POSTGRES_PASSWORD") }}
  {{- $dbPass = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else if .Values.db.password }}
  {{- $dbPass = .Values.db.password }}
{{- else }}
  {{- $dbPass = randAlphaNum (.Values.secrets.passwordLength | int) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: udp-db
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "database") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ $dbPass | quote }}
{{- /*
Role secrets of the CNPG cluster (templates/timescale.yaml): CNPG sets role
passwords from basic-auth secrets whose username must equal the role name.
Same password as udp-db – the clients keep their credentials. With externally
managed secrets (db.existingSecret / secrets.create=false) they are NOT
rendered here (the password would end up in the Helm release) – provide them
the same way, see DEPLOY.md §4.

cnpg.io/passwordPassthrough: since 1.29.3/1.30.1 the operator SCRAM-hashes
passwords itself and ignores password_encryption. The libpq of Orion-LD cannot
do SCRAM, so the password must reach PostgreSQL verbatim and be stored as MD5
(password_encryption: md5 in the cluster).
cnpg.io/reload: apply a password change without waiting for the next resync.
*/}}
{{- range $role := list $.Values.db.user "ckan_ro" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: timescale-role-{{ $role | replace "_" "-" }}
  labels:
    {{- include "udp.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
    cnpg.io/reload: "true"
  annotations:
    cnpg.io/passwordPassthrough: "enabled"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $role | quote }}
  password: {{ $dbPass | quote }}
{{- end }}
{{- end }}

{{- if and .Values.secrets.create (not .Values.keycloak.existingSecret) }}
{{- $existingKc := lookup "v1" "Secret" .Release.Namespace "udp-keycloak" }}
{{- $kcPass := "" }}
{{- if and $existingKc $existingKc.data (index $existingKc.data "KEYCLOAK_ADMIN_PASSWORD") }}
  {{- $kcPass = index $existingKc.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
{{- else if .Values.keycloak.adminPassword }}
  {{- $kcPass = .Values.keycloak.adminPassword }}
{{- else }}
  {{- $kcPass = randAlphaNum (.Values.secrets.passwordLength | int) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: udp-keycloak
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ $kcPass | quote }}
{{- end }}

{{- if and .Values.ckan.enabled .Values.secrets.create (not .Values.ckan.existingSecret) }}
{{- $existingCkan := lookup "v1" "Secret" .Release.Namespace "udp-ckan" }}
{{- $ckanPass := "" }}
