type: Opaque
stringData:
  CKAN_SYSADMIN_NAME: {{ .Values.ckan.adminUser | quote }}
  CKAN_SYSADMIN_PASSWORD: {{ $ckanPass | quote }}
{{- end }}

{{- if and .Values.geoserver.enabled .Values.secrets.create (not .Values.geoserver.existingSecret) }}
{{- $existingGs := lookup "v1" "Secret" .Release.Namespace "udp-geoserver" }}
{{- $gsPass := "" }}
{{- if and $existingGs $existingGs.data (index $existingGs.data "GEOSERVER_ADMIN_PASSWORD") }}
  {{- $gsPass = index $existingGs.data "GEOSERVER_ADMIN_PASSWORD" | b64dec }}
{{- else if .Values.geoserver.adminPassword }}
  {{- $gsPass = .Values.geoserver.adminPassword }}
{{- else }}
  {{- $gsPass = randAlphaNum (.Values.secrets.passwordLength | int) }}
{{- end }}
