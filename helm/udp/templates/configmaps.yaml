# ConfigMaps aus gebündelten Konfigurationsdateien (files/).
# APISIX-Konfiguration (Standalone-Modus)
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "apisix") | nindent 4 }}
data:
  # .tpl, weil die Datei Go-Template-Bedingungen enthält: abgeschaltete
  # Komponenten (ckan/geoserver/masterportal) sollen keine Route hinterlassen,
  # die auf einen nicht existierenden Service zeigt.
  apisix.yaml: |
{{ tpl (.Files.Get "files/apisix/apisix.yaml.tpl") . | indent 4 }}
  config.yaml: |
{{ tpl (.Files.Get "files/apisix/config.yaml.tpl") . | indent 4 }}
---
# Keycloak-Realm-Import
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
data:
  udp-realm.json: |
{{ tpl (.Files.Get "files/keycloak/udp-realm.json.tpl") . | indent 4 }}
---
# Laufzeit-Konfiguration des Cockpits.
#
# Das Image bringt eine public/config.js mit, die auf Docker Compose vorbelegt
# ist (http://localhost:8700 für Keycloak, 8780 für das Gateway). Im Cluster
# ist das FALSCH: die SPA schickt den Browser des Anwenders dann zum Login auf
# seinen EIGENEN Rechner. Die Datei wird deshalb hier aus den Chart-Werten neu
# erzeugt und über die des Images gemountet (apps.yaml, subPath config.js).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cockpit-config
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "cockpit") | nindent 4 }}
data:
  config.js: |
{{ include "udp.cockpitConfigJs" . | indent 4 }}
---
{{- $branding := include "udp.branding" . | fromJson }}
{{- if $branding.files }}
# Logo und Favicon des Betreibers (cockpit.branding), geprüft in
# udp.branding. Als Verzeichnis unter /usr/share/nginx/html/branding
# gemountet; nginx liefert sie unter /branding/ und /favicon aus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cockpit-branding
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "cockpit") | nindent 4 }}
binaryData:
  {{- range $file, $data := $branding.files }}
  {{ $file }}: {{ $data }}
  {{- end }}
---
{{- end }}
# Node-RED (Upstream-Image): Beispielfluss und settings.js. Kopien von
# platform/config/nodered/ (Compose mountet die Originale); ein statischer Test
# hält beide Stände gleich. Der initContainer kopiert sie nach /data, damit
# Deploys aus dem Editor funktionieren (flüchtig, s. templates/apps.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-red-config
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "node-red") | nindent 4 }}
data:
  flows.json: |
{{ .Files.Get "files/nodered/flows.json" | indent 4 }}
  settings.js: |
{{ .Files.Get "files/nodered/settings.js" | indent 4 }}
---
# PostgreSQL-Initialisierung (Datenbanken, Auth-Kompatibilität)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "database") | nindent 4 }}
data:
  00-auth.sh: |
{{ .Files.Get "files/postgres/00-auth.sh" | indent 4 }}
  01-databases.sql: |
{{ .Files.Get "files/postgres/01-databases.sql" | indent 4 }}
---
# Mosquitto listeners (MQTT 1883, WebSocket 9001). Without this file Mosquitto
# 2.x falls back to "local only mode" and binds 127.0.0.1 only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mosquitto") | nindent 4 }}
data:
  mosquitto.conf: |
{{ .Files.Get "files/mosquitto/mosquitto.conf" | indent 4 }}
