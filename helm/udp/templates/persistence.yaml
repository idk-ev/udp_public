# =============================================================================
# Persistenzschicht: MongoDB (Orion-LD). PostgreSQL: templates/timescale.yaml
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mongo") | nindent 4 }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      {{- include "udp.selectorLabels" "mongo" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "udp.podLabels" (dict "ctx" . "component" "mongo") | nindent 8 }}
    spec:
      {{- include "udp.podSpec" (dict "ctx" . "cfg" .Values.mongo) | nindent 6 }}
      containers:
        - name: mongo
          image: {{ include "udp.image" (dict "ctx" . "image" .Values.mongo.image) }}
          args: ["--nojournal", "--quiet"]
          ports: [{ containerPort: 27017 }]
          securityContext:
            {{- include "udp.containerSecurityContext" (dict "ctx" . "override" .Values.mongo.containerSecurityContext) | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data/db }
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
          {{- include "udp.probes" .Values.mongo.probes | nindent 10 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "udp.storageClass" (dict "ctx" . "override" .Values.mongo.persistence.storageClass) | nindent 8 }}
        resources: { requests: { storage: {{ .Values.mongo.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "mongo") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "udp.selectorLabels" "mongo" | nindent 4 }}
  ports: [{ port: 27017 }]
