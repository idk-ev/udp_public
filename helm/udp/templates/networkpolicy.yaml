{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
# =============================================================================
# NetworkPolicies – least-privilege platform network
# Requires a CNI that enforces policies (Calico, Cilium, …).
#
# Model:
#   1. default-deny-ingress: no pod is reachable unless a rule below allows it.
#   2. One policy per component: only its actual callers, only its ports.
#      The table below IS the communication matrix of the platform – a new
#      caller needs a line here (or networkPolicies.extraFrom).
#   3. The ingress controller reaches the public frontends; the monitoring
#      namespace (networkPolicies.monitoringNamespaceLabel) and an Uptime Kuma
#      in this namespace reach the HTTP services, never the data stores.
#   4. optional strictEgress: default-deny outgoing, allowed are DNS, the
#      namespace itself and – for the listed components – the internet.
#      Without strictEgress there is deliberately NO egress policy: a single
#      one would lock all outgoing traffic of the selected pods.
# =============================================================================

{{- /*
Communication matrix. from = app labels of the calling pods in this namespace.
public = reachable from the ingress controller. monitored = reachable from the
monitoring namespace / Uptime Kuma. Disabled components drop out.
*/}}
{{- $mongoClients := list "orion-ld" "iot-agent-json" }}
{{- /* Index hook job (templates/mongo-indexes.yaml). */}}
{{- if .Values.mongo.indexes.enabled }}{{ $mongoClients = append $mongoClients "mongo-indexes" }}{{ end }}
{{- $timescaleClients := list "orion-ld" "mintaka" "frost" "keycloak" "node-red" }}
{{- if .Values.ckan.enabled }}{{ $timescaleClients = append $timescaleClients "ckan" }}{{ end }}
{{- if .Values.backup.enabled }}{{ $timescaleClients = append $timescaleClients "db-backup" }}{{ end }}
{{- $legacyTimescale := ne (.Values.timescale.migration.phase | default "") "" }}
{{- /* Copy job of scripts/migrate-timescale-cnpg.sh – only during the migration. */}}
{{- if $legacyTimescale }}{{ $timescaleClients = append $timescaleClients "timescale-migrate" }}{{ end }}
{{- $rules := list
  (dict "app" "apisix"         "ports" (list 9080)      "from" (list "cockpit")                         "public" true "monitored" true)
  (dict "app" "cockpit"        "ports" (list 8080)      "from" (list "node-red")                        "public" true "monitored" true)
  (dict "app" "keycloak"       "ports" (list 8080)      "from" (list "apisix")                          "public" true "monitored" true)
  (dict "app" "orion-ld"       "ports" (list 1026)      "from" (list "apisix" "iot-agent-json" "node-red")            "monitored" true)
  (dict "app" "mintaka"        "ports" (list 8080)      "from" (list "apisix")                                        "monitored" true)
  (dict "app" "frost"          "ports" (list 8080)      "from" (list "apisix")                                        "monitored" true)
  (dict "app" "iot-agent-json" "ports" (list 4041 7896) "from" (list "apisix" "orion-ld")                             "monitored" true)
  (dict "app" "node-red"       "ports" (list 1880)      "from" (list "cockpit")                                       "monitored" true)
  (dict "app" "mongo"          "ports" (list 27017)     "from" $mongoClients)
  (dict "app" "mosquitto"      "ports" (list 1883 9001) "from" (list "iot-agent-json"))
}}
{{- if .Values.ckan.enabled }}
{{- $rules = concat $rules (list
  (dict "app" "ckan"  "ports" (list 5000) "from" (list "apisix") "monitored" true)
  (dict "app" "solr"  "ports" (list 8983) "from" (list "ckan"))
  (dict "app" "redis" "ports" (list 6379) "from" (list "ckan"))) }}
{{- end }}
{{- /* Old single-instance StatefulSet (migration phases only). The CNPG
     instances carry no app label – their policy follows below. */}}
{{- if $legacyTimescale }}
{{- $rules = append $rules (dict "app" "timescale" "ports" (list 5432) "from" $timescaleClients) }}
{{- end }}
{{- if .Values.geoserver.enabled }}
{{- $rules = append $rules (dict "app" "geoserver" "ports" (list 8080) "from" (list "apisix") "monitored" true) }}
{{- end }}
{{- if .Values.masterportal.enabled }}
{{- $rules = append $rules (dict "app" "masterportal" "ports" (list 80) "from" (list "apisix") "monitored" true) }}
{{- end }}

# 1. Default deny for all incoming traffic in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range $rules }}
{{- $extra := get ($np.extraFrom | default dict) .app }}
---
# 2. {{ .app }}: {{ join ", " .from }}{{ if .public }} + ingress controller{{ end }}{{ if .monitored }} + monitoring{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .app }}
  labels:
    {{- include "udp.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: {{ .app }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: {{ toJson .from }} }
        {{- if .public }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressControllerNamespaceLabel | nindent 14 }}
        {{- end }}
        {{- if .monitored }}
        # Uptime Kuma in this namespace (legacy layout, s. monitoring/README.md).
        - podSelector:
            matchLabels: { app.kubernetes.io/name: uptime-kuma }
        {{- with $np.monitoringNamespaceLabel }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- with $extra }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
---
# 2b. CNPG instances of the database cluster "timescale": the platform
#     components on 5432, the other instances among each other (replication,
#     pg_rewind, status), the CNPG operator on 8000 (status) and 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-timescale-cnpg
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: timescale }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: {{ toJson $timescaleClients }} }
        {{- with get ($np.extraFrom | default dict) "timescale" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector:
            matchLabels: { cnpg.io/cluster: timescale }
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.cnpgOperator.namespaceLabel | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $np.cnpgOperator.podLabels | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
{{- with $np.monitoringNamespaceLabel }}
---
# 3. Prometheus metrics of APISIX for the monitoring namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apisix-metrics
  labels:
    {{- include "udp.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: apisix }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9091 }
{{- end }}
{{- if .Values.ingress.clusterIssuer }}
---
# 3b. HTTP-01 solver of cert-manager. cert-manager creates these pods itself
#     during issuance – they carry NO app label and would fall under
#     default-deny-ingress. Without this rule the ingress controller cannot
#     reach the solver, the challenge stays "pending" ("failed to perform self
#     check ... context deadline exceeded") and no certificate is ever issued.
#     The acmesolver listens on 8089.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressControllerNamespaceLabel | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8089 }
{{- end }}
{{- if $np.strictEgress }}
---
# 4. strictEgress: default deny outgoing. Allowed: DNS, the namespace itself
#    and the internet for networkPolicies.internetEgress.components.
#
#    IMPORTANT: these policies belong TOGETHER. An egress policy with
#    podSelector {} turns egress of EVERY pod in the namespace into default
#    deny – only what the egress rules list is allowed. When allow-dns-egress
#    once existed on its own (also with strictEgress=false), all outgoing
#    traffic except DNS was blocked: mintaka/orion-ld/ckan/keycloak ran into
#    "Connect timed out" to timescale/mongo without any ingress rule missing.
#    Without strictEgress there must be NO egress policy at all.
#
#    CAUTION: podSelector {} hits EVERY pod of the namespace, including those of
#    OTHER releases. Uptime Kuma in this namespace would lose all external
#    checks – the monitoring belongs in its own namespace anyway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.dnsNamespaceLabel | nindent 14 }}
        {{- with $np.dnsExtraTo }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-egress
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
{{- if not $np.apiServerEgress.to }}
{{- fail "networkPolicies.strictEgress needs networkPolicies.apiServerEgress.to – the database instances must reach the Kubernetes API (see values.yaml)." }}
{{- end }}
---
# The CNPG instances talk to the Kubernetes API (status, leader lease).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-timescale-cnpg-apiserver-egress
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: timescale }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $np.apiServerEgress.to | nindent 8 }}
      ports:
        {{- range $np.apiServerEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- with $np.internetEgress.components }}
---
# Internet access (HTTP/HTTPS) for components that fetch external data:
# Node-RED connectors, JSON-LD @contexts (Orion-LD, IoT agent), CKAN harvesting.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  labels:
    {{- include "udp.labels" (dict "ctx" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: {{ toJson . }} }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $np.internetEgress.exceptCidrs }}
            except: {{ toJson . }}
            {{- end }}
      ports:
        {{- range $np.internetEgress.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress: []
{{- end }}
{{- end }}
