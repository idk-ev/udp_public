# Dedizierter ServiceAccount für alle UDP-Workloads.
# Keiner der Dienste spricht die Kubernetes-API an -> Token nicht einhängen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: udp
  labels:
    {{- include "udp.labels" (dict "ctx" . "component" "udp") | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
