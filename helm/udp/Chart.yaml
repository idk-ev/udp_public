apiVersion: v2
name: udp
description: >-
  Urbane Datenplattform (UDP) – FIWARE-basierte Smart-City-Plattform:
  Context Broker (Orion-LD/Mintaka), IoT (Mosquitto/IoT-Agent/FROST),
  API-Gateway (APISIX), Identität (Keycloak), Persistenz (MongoDB, PostGIS)
  sowie Anwendungsdienste (Node-RED, Cockpit). Das Verfügbarkeits-Monitoring
  wird bewusst getrennt ausgerollt: monitoring/helm/uptime-kuma.
type: application

# Chart-Version (SemVer) – bei jeder Chart-Änderung erhöhen. Muss zum
# Release-Tag passen: der Job "chart" in .github/workflows/build-images.yml
# bricht ab, wenn "v<version>" nicht dem getaggten Release entspricht.
# Uptime Kuma ist nicht Teil des Charts (eigenes Release unter monitoring/) –
# zum Upgrade von einem Stand, der es noch enthielt, s. DEPLOY.md §11.
version: 1.0.1

# Version der ausgelieferten Plattform (informativ, erscheint in kubectl).
appVersion: "1.0.1"

keywords:
  - fiware
  - smart-city
  - ngsi-ld
  - iot
  - urban-data-platform
home: https://github.com/idk-ev/udp

# Deutschsprachige Annotation für Artifact Hub o. Ä.
annotations:
  category: IoT
