# Mosquitto – MQTT-Broker der UDP (Sensor-Ingest über IoT-Agent)
persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Demo-Betrieb: anonymer Zugriff. Produktion: Auth über Passwort-Datei/TLS,
# siehe docs/betrieb.md (Härtung).
allow_anonymous true
