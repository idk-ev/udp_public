# Global mongosh configuration of the sidecar "replset" (mounted as
# /etc/mongosh.conf, templates/persistence.yaml).
#
# mongosh writes a session log under $HOME/.mongodb/mongosh/ by default. The
# sidecar is one long-running mongosh process, so that single file grows
# without bound (every connection to a peer adds entries) until it fills the
# emptyDir and the kubelet evicts the whole pod – mongod included. Its output
# goes to stdout (kubectl logs) anyway, so mongosh's own log is switched off.
mongosh:
  disableLogging: true
