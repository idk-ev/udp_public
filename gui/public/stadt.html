<style>
  /* Seitenspezifisch (Basis kommt aus smartcity-theme.css) */
  #map { height: 460px; }
  .disclaimer { font-size: .78rem; color: var(--text-muted); margin: -8px 0 14px; }
  .fc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fc .day { text-align: center; background: linear-gradient(180deg, var(--surface-1), var(--surface-0));
             border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; }
  .fc .d-name { font-size: .82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 2px; }
  .fc .d-ico { display: flex; justify-content: center; margin: 2px 0; }
  .fc .d-temp { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
  .fc .d-temp .lo { color: var(--text-muted); font-weight: 500; font-size: .95rem; }
  .fc .d-bar { position: relative; height: 6px; border-radius: 999px; background: var(--surface-0);
               margin: 7px 4px 8px; overflow: hidden; }
  .fc .d-bar span { position: absolute; top: 0; height: 100%; border-radius: 999px; min-width: 6px; }
  .fc .d-meta { font-size: .72rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .fc .d-uv { color: #fff; border-radius: 999px; padding: 0 7px; font-size: .68rem; font-weight: 600; }
  @media (max-width: 560px) { .fc { grid-template-columns: repeat(2, 1fr); } }
  .line-badge { display: inline-block; min-width: 30px; text-align: center; padding: 1px 7px; border-radius: 6px;
                background: color-mix(in srgb, var(--series-1) 18%, var(--surface-1));
                border: 1px solid color-mix(in srgb, var(--series-1) 40%, var(--surface-1)); font-weight: 600; font-size: .8rem; }
  .delay-0 { color: var(--text-muted); } .delay-w { color: var(--status-warn); font-weight: 600; }
  .delay-s { color: var(--status-serious); font-weight: 600; }
  body.embed header, body.embed .legal-links, body.embed .searchlink, body.embed .footer-nav { display: none; }
  body.embed { padding: 8px; }
  /* Embedded, the source credits stay (CC BY / dl-de/by require them where
     the data is shown) – as one compact line. */
  body.embed footer { margin-top: 8px; font-size: .68rem; line-height: 1.5; }
  /* Service-Link-Kacheln: dezente, klar als „führt zu externem Angebot“ lesbare Optik */
  a.tile.tile-link { background: color-mix(in srgb, var(--accent) 14%, var(--surface-1));
                     border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--surface-1)); color: var(--text-primary); }
  a.tile.tile-link .label { color: var(--accent); }
  a.tile.tile-link .value { color: var(--text-primary); }
  a.tile.tile-link .hint { color: var(--text-muted); }
  /* Einwort-Domains (heiligkreuzsteinach.de) haben keine Umbruchstelle und liefen
     sonst über den abgerundeten Rand — kappen statt überlaufen, voller Wert im title. */
  a.tile.tile-link .value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Sicherheitsnetz für lange Einzelwörter in Kachelwerten (»sehr schlecht« u. a.) */
  .tile .value { overflow-wrap: anywhere; }
  /* Leere „Potenzial“-Kachel: gedämpft, gestrichelt — signalisiert Ausbaumöglichkeit,

  a.tile.tile-empty { background: var(--surface-1); border: 1px dashed var(--border); color: var(--text-secondary); }
  a.tile.tile-empty .label { color: var(--text-muted); }
  a.tile.tile-empty .value { font-size: 1rem; font-weight: 600; color: var(--text-secondary); line-height: 1.3; padding-top: 4px; }
  a.tile.tile-empty .hint { color: var(--text-muted); }
  a.tile.tile-empty:hover { border-color: var(--accent); }
  /* Dienst-Kacheln (Mängel, Müllabfuhr, Veranstaltungen) sollen wie die Datenkacheln
     wirken: voller --tile-Hintergrund statt Akzent-Tönung/gestrichelt. */
  a.tile.tile-plain { background: var(--tile);
                      border: 1px solid color-mix(in srgb, var(--tile) 80%, #000); color: rgba(255,255,255,.92); }
  a.tile.tile-plain .label { color: rgba(255,255,255,.88); }
  a.tile.tile-plain .value { color: #fff; }
  a.tile.tile-plain .hint { color: rgba(255,255,255,.72); }
  /* Pollen-Symbole in der Detailtabelle */
  .pollen-ico svg { width: 18px; height: 18px; vertical-align: -4px; margin-right: 7px; color: var(--accent); }

<script>
"use strict";
const { $, css, esc, safeUrl, val, obsTime, staleStand, asArray, asRows, jget, jlist, entity, byAgs, tile, errorTile, failed, grade, sharingSplit, fmtN, fmtDay, pos, popupHtml, groupColor, hist, series, chart, barSvg } = SC;

let GEM = [], BY_AGS = {}, BY_SLUG = {}, CONN = [], DASH = {}, SERVICES = {}, STADT = window.STADT || null;

// opening_hours-Mini-Parser: gängige Muster (Mo-Fr 08:00-12:00; Sa …);
// unbekannte Syntax -> null (dann Rohtext anzeigen)
function ohToday(oh) {
  try {
    const days = ["Su","Mo","Tu","We","Th","Fr","Sa"], today = days[new Date().getDay()], idx = d => days.indexOf(d);
    const spans = [];
    // Viele Rathäuser trennen Regeln mit »,« statt »;« (OSM-Fehlschreibweise),
    // z. B. »Mo,Tu,Th,Fr 08:00-12:00, Th 15:30-18:00«. Ein Komma, das auf eine
    // Uhrzeit folgt und vor einem Wochentag steht, ist ein Regeltrenner — in »;«
    // normalisieren (Komma innerhalb von Tag-/Zeitlisten bleibt unberührt).
    const norm = String(oh).replace(/(\d{2}:\d{2})\s*,\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su)\b)/g, "$1; ");
    for (const rule of norm.split(";")) {
      const r = rule.trim(); if (!r) continue;
      if (/off|closed/i.test(r)) continue;
      const m = r.match(/^([A-Za-z ,-]+?)?\s*(\d{2}:\d{2}-\d{2}:\d{2}(?:,\s*\d{2}:\d{2}-\d{2}:\d{2})*)$/);
      if (!m) return null;
      let applies = false;
      for (const seg of (m[1] || "Mo-Su").trim().split(",")) {
        const mm = seg.trim().match(/^([A-Z][a-z])(?:-([A-Z][a-z]))?$/);
        if (!mm) return null;
        if (mm[2]) { const a = idx(mm[1]), b = idx(mm[2]), t = idx(today);
          if (a <= b ? (t >= a && t <= b) : (t >= a || t <= b)) applies = true; }
        else if (mm[1] === today) applies = true;
      }
      if (applies) spans.push(...m[2].split(",").map(x => x.trim()));
    }
    if (!spans.length) return { open: false, next: null, text: "heute nicht geöffnet" };
    const n = new Date(), cur = n.getHours() * 60 + n.getMinutes();
    let open = false, next = null;
    for (const sp of spans) {
      const [a, b] = sp.split("-"), [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
      const von = h1 * 60 + m1;
      if (cur >= von && cur < h2 * 60 + m2) open = true;
      else if (cur < von && (next === null || von < next)) next = von;
    }
    return { open, next, text: "heute " + spans.join(" und ") + " Uhr" };
  } catch (e) { return null; }
}

// WMO-Wettercode -> SVG-Symbol + Kurztext. Reine Inline-SVGs (CSP-konform).
function wmoIcon(code) {
  const c = Number(code);
  const S = (inner, label) => ({ svg: `<svg viewBox="0 0 48 48" width="42" height="42" aria-label="${label}" role="img">${inner}</svg>`, label });
  const sun = `<circle cx="24" cy="22" r="10" fill="#f6b73c"/><g stroke="#f6b73c" stroke-width="2.5" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,x=24+Math.cos(r)*16,y=22+Math.sin(r)*16,x2=24+Math.cos(r)*20,y2=22+Math.sin(r)*20;return `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;}).join("")}</g>`;
  const cloud = (x=24,y=26,f="#c7d0d8") => `<path d="M${x-13} ${y+4} a8 8 0 0 1 3-15 a10 10 0 0 1 19 2 a7 7 0 0 1 -1 13 Z" fill="${f}"/>`;
  const drops = (f="#4aa3e0") => `<g fill="${f}">${[16,24,32].map(x=>`<path d="M${x} 34 q-2 4 0 5 q2 -1 0 -5"/>`).join("")}</g>`;
  const flakes = (f="#9cc7e8") => `<g fill="${f}">${[16,24,32].map(x=>`<circle cx="${x}" cy="37" r="1.8"/>`).join("")}</g>`;
  if (c === 0) return S(sun, "sonnig");
  if (c === 1 || c === 2) return S(sun.replace('cx="24"','cx="18"').replace('cy="22" r="10"','cy="18" r="8"') + cloud(28,28), "heiter bis wolkig");
  if (c === 3 || c === 45 || c === 48) return S(cloud(24,24), c>=45?"neblig":"bewölkt");
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return S(cloud(24,22) + drops(), "Regen");
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return S(cloud(24,22) + flakes(), "Schnee");
  if (c >= 95) return S(cloud(24,22,"#8a94a0") + `<path d="M22 33 l-4 7 h5 l-3 6" fill="none" stroke="#f6b73c" stroke-width="2.5" stroke-linecap="round"/>`, "Gewitter");
  return S(cloud(24,24), "bewölkt");
}

// District names by district key (bw-gemeinden.json, column kreise; the page does
// not load that catalogue otherwise). tests/static/tile-values.test.js checks both agree.
const KREIS_NAME = {
  "08111": "Stadtkreis Stuttgart", "08115": "Landkreis Böblingen", "08116": "Landkreis Esslingen",
  "08117": "Landkreis Göppingen", "08118": "Landkreis Ludwigsburg", "08119": "Rems-Murr-Kreis",
  "08121": "Stadtkreis Heilbronn", "08125": "Landkreis Heilbronn", "08126": "Hohenlohekreis",
  "08127": "Landkreis Schwäbisch Hall", "08128": "Main-Tauber-Kreis", "08135": "Landkreis Heidenheim",
  "08136": "Ostalbkreis", "08211": "Stadtkreis Baden-Baden", "08212": "Stadtkreis Karlsruhe",
  "08215": "Landkreis Karlsruhe", "08216": "Landkreis Rastatt", "08221": "Stadtkreis Heidelberg",
  "08222": "Stadtkreis Mannheim", "08225": "Neckar-Odenwald-Kreis", "08226": "Rhein-Neckar-Kreis",
  "08231": "Stadtkreis Pforzheim", "08235": "Landkreis Calw", "08236": "Enzkreis",

  "08315": "Landkreis Breisgau-Hochschwarzwald", "08316": "Landkreis Emmendingen", "08317": "Ortenaukreis",

};
// Levels of the DWD heat index; the index is the rank, as RANK in hitze-bw.ts.
const HITZE_LVL = ["keine", "gering", "mittel", "hoch", "extrem"];
const heatRank = l => Math.max(0, HITZE_LVL.indexOf(l));
// Beyond this the representative city only gives the regional picture (median
// distance 37 km, max 99 km); the tile says so instead of hiding the warning.
const HITZE_REGIONAL_KM = 50;
// Calendar day in Berlin as YYYY-MM-DD.
const berlinDay = t => new Date(t).toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });

// Pollen-Belastungsstufen (DWD-Skala 0–3 mit Zwischenstufen)
const POLLEN_WORT = { "0": "keine", "0-1": "keine–gering", "1": "gering", "1-2": "gering–mittel",
                      "2": "mittel", "2-3": "mittel–hoch", "3": "hoch" };
const pollenNum = v => { const m = String(v).split("-"); return (parseFloat(m[0]) + parseFloat(m[m.length-1])) / 2; };
// Symbole je Pollenart (Inline-SVG, CSP-fest): Gräser/Roggen als Halm, Bäume als
// Baumsilhouette, Kräuter (Beifuß/Ambrosia) als Blütentrieb. Farbe = currentColor.
const POLLEN_ICON = {
  Graeser: '<path d="M12 21V9"/><path d="M12 14c-2.5-1-4-3.5-4-6.5 3 .5 4.5 3 4 6.5"/><path d="M12 14c2.5-1 4-3.5 4-6.5-3 .5-4.5 3-4 6.5"/>',
  Roggen: '<path d="M12 21V7"/><path d="M12 9c1.5 0 2.5-1 2.5-2.5C13 6.5 12 7.5 12 9M12 9c-1.5 0-2.5-1-2.5-2.5C11 6.5 12 7.5 12 9M12 12.5c1.5 0 2.5-1 2.5-2.5C13 9.5 12 10.5 12 12.5M12 12.5c-1.5 0-2.5-1-2.5-2.5C11 9.5 12 10.5 12 12.5"/>',
  Birke: '<path d="M12 21v-6"/><circle cx="12" cy="9" r="6"/>',
  Erle: '<path d="M12 21v-4"/><path d="M6 17 12 4l6 13z"/>',
  Hasel: '<path d="M12 21v-7"/><path d="M9 6c0 3 1 5 3 8 2-3 3-5 3-8"/><path d="M10 5v2M14 5v2"/>',
  Esche: '<path d="M12 21V4"/><path d="M12 7l4-1M12 7 8 6M12 11l4-1M12 11 8 10M12 15l4-1M12 15 8 14"/>',
  Beifuss: '<path d="M12 21V6"/><path d="M12 10 8 7M12 10l4-3M12 15l-4-3M12 15l4-3"/>',
  Ambrosia: '<path d="M12 21v-8"/><circle cx="12" cy="6" r="1.4"/><circle cx="8.5" cy="9" r="1.4"/><circle cx="15.5" cy="9" r="1.4"/><path d="M12 13V8M12 13l-3.2-2.6M12 13l3.2-2.6"/>',
};
const pollenGlyph = name => POLLEN_ICON[name]
  ? `<span class="pollen-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${POLLEN_ICON[name]}</svg></span>`
  : "";

// Kartenebenen-Farben: kräftige, klar unterscheidbare kategoriale Palette (über
// den Farbkreis verteilt), damit sich auch überlappende Pins verschiedener
// Ebenen deutlich abheben. Die Ladestationen tragen ihren Status als
// Markerfarbe (grün/gelb/rot/grau); ihre Legende bleibt neutral. Umland-
// Baustellen sind Nebeninfo und deshalb bewusst zurückhaltendes Warmgrau.
const MAP_C = { stadt: "#2563eb", stationen: "#06b6d4", carsharing: "#9333ea",
                leihrad: "#ea580c", br: "#db2777", sensoren: "#b45309", rad: "#0d9488",
                pegel: "#1e3a8a", ausflug: "#16a34a", baustellen: "#eab308",
                umland: "#78716c", laden: "#64748b", parken: "#0ea5e9" };

// Kartensymbole: einheitliches Linien-Icon-Set (Lucide/Feather-Stil) in der
// jeweiligen Ebenenfarbe, als Inline-SVG neu gezeichnet (CSP-fest, offline).
// Die weiße Kontur/Glow liefert die .mkr-Umrandung bzw. der Legenden-Chip.
const glyphA = (color, path) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color || "#64748b"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
// Ladepunkte tragen den Status in der Farbe (grün = online, grau = offline).
const boltGlyph = c => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h6 l-1 8 l9-12 h-6 z" fill="${c || "#64748b"}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
// E-Scooter-Silhouette (Tretroller) in der Anbieter-Markenfarbe — als „Markensymbol"
// ohne echte Anbieterlogos (die sind geschützte Marken). Die Farbe stammt aus
// brandColor() und ist damit repo-eigen, nicht aus Fremddaten — trotzdem
// maskiert, weil sie in einem Attribut landet.
const scooterGlyph = c => `<svg viewBox="0 0 24 24" fill="none" stroke="${esc(c || "#64748b")}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="18" r="2.5"/><circle cx="18.5" cy="18" r="2.5"/><path d="M8 18h7l3.6-11H21"/><path d="M16.6 18 15.2 13"/></svg>`;
// Linien-Pfade je Ebene (24er-Raster).
const ICON = {
  "Stationen (ÖPNV/Wetter/UBA)": '<path d="M8 6v6M15 6v6M2 12h19.6M18 18h.01M6 18h.01"/><rect x="4" y="4" width="16" height="14" rx="2"/><path d="M4 18v2M20 18v2"/>',
  "Carsharing": '<path d="M5 11l1.5-4.3A2 2 0 0 1 8.4 5.3h7.2a2 2 0 0 1 1.9 1.4L19 11M5 11h14a2 2 0 0 1 2 2v3h-2M5 11a2 2 0 0 0-2 2v3h2M7 16h10"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/>',
  "B+R Fahrradparken": '<circle cx="6" cy="17" r="3.2"/><circle cx="18" cy="17" r="3.2"/><path d="M6 17l4-6h5M10 11l2.5-4H15M14.5 7 18 17"/>',
  "Pegel": '<path d="M2 7c1 .8 2 .8 3 0s2-.8 3 0 2 .8 3 0 2-.8 3 0 2 .8 3 0 2-.8 3 0M2 12c1 .8 2 .8 3 0s2-.8 3 0 2 .8 3 0 2-.8 3 0 2 .8 3 0 2-.8 3 0M2 17c1 .8 2 .8 3 0s2-.8 3 0 2 .8 3 0 2-.8 3 0 2 .8 3 0 2-.8 3 0"/>',
  "Ausflugsziele": '<path d="M9 4 7.5 6.5H4.5A1.5 1.5 0 0 0 3 8v10.5A1.5 1.5 0 0 0 4.5 20h15a1.5 1.5 0 0 0 1.5-1.5V8a1.5 1.5 0 0 0-1.5-1.5h-3L15 4z"/><circle cx="12" cy="13" r="3.4"/>',
  "Familie & Versorgung": '<path d="M19 13.5c1.4-1.4 2.6-2.9 2.6-5A4.6 4.6 0 0 0 17 4c-1.6 0-2.8.6-4 2-1.2-1.4-2.4-2-4-2A4.6 4.6 0 0 0 4.4 8.5c0 2.1 1.2 3.6 2.6 5L12 19z"/><path d="M4.5 11.5H9l1-2 2 4 1.5-3 .8 1.5h4.2"/>',

const UV_STOPS = [[0, 3, "var(--status-good)", "niedrig"], [3, 6, "var(--status-warn)", "mäßig"], [6, 8, "#f97316", "hoch"], [8, 11, "var(--status-serious)", "sehr hoch"]];
// UBA air quality index: 0 = very good … 4 = very bad (UBA API v3).
const AQI_LABEL = ["sehr gut", "gut", "mäßig", "schlecht", "sehr schlecht"];
// Five equal bands over 0–4, so that every level, "sehr schlecht" included, has a visible arc.
const AQI_STOPS = [[0, 0.8, "var(--status-good)", "sehr gut"], [0.8, 1.6, "#65a30d", "gut"], [1.6, 2.4, "var(--status-warn)", "mäßig"], [2.4, 3.2, "#f97316", "schlecht"], [3.2, 4.01, "var(--status-serious)", "sehr schlecht"]];
// Index of a UBA entity on the 0–4 scale, null when missing (a data gap, not a value).
const aqiOf = e => { const v = val(e, "airQualityIndex"); return Number.isInteger(v) && v >= 0 && v <= 4 ? v : null; };
const NO2_STOPS = [[0, 40, "var(--status-good)", "unter Grenzwert"], [40, 60, "var(--status-warn)", "erhöht"], [60, 100, "var(--status-serious)", "hoch"]];

const HUM_STOPS = [[0, 30, "var(--status-warn)", "trocken"], [30, 65, "var(--status-good)", "behaglich"], [65, 100, "var(--status-warn)", "feucht"]];

// Hochwasservorhersagezentrale der LUBW: replaces the state gauges (pegel-lubw is off).
const HVZ_URL = "https://hvz.lubw.baden-wuerttemberg.de/";
// Service-Kachel, die auf ein externes kommunales Angebot verlinkt. Die Hauptinfo
// ist eine klare Aktion (nicht die rohe URL); die Beschreibung steht als Hinweis,
// die genaue Adresse im Tooltip.
function linkTile(label, url, hintTxt, topic = "service", plain = false, explainTxt = null) {
  let host = url; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {}
  return `<a class="tile tile-link${plain ? " tile-plain" : ""}" data-topic="${topic}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener"
    title="${esc(host)}" data-explain="${esc(explainTxt || "Offizielles Angebot der Kommune — öffnet extern (" + host + ").")}">
    <div class="label">${esc(label)}</div><div class="value">Öffnen →</div>
    <div class="hint">${esc(hintTxt)}</div></a>`;
}
// Leere „Potenzial“-Kachel: die Kommune stellt diesen Dienst (noch) nicht als
// Datenquelle bereit. Bewusst sichtbar statt weggelassen — als ehrlicher Hinweis
// auf eine Ausbaumöglichkeit, Klick führt zur Mitmach-Seite.
function emptyTile(label, potentialTxt, topic = "service", plain = false) {
  return `<a class="tile tile-empty${plain ? " tile-plain" : ""}" data-topic="${topic}" href="/mitmachen.html"
    data-explain="Diese Kommune stellt „${esc(label)}“ noch nicht bereit. Der Dienst lässt sich mit geringem Aufwand ergänzen — Klick: mehr erfahren.">
    <div class="label">${esc(label)}</div><div class="value">Noch nicht verfügbar</div>
    <div class="hint">${esc(potentialTxt)} — für diese Kommune ergänzbar →</div></a>`;
}

function applyFilter(f) {
  document.querySelectorAll("#chips .chip-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  document.querySelectorAll("[data-topic]").forEach(el =>
    el.classList.toggle("topic-hidden", !!f && el.dataset.topic !== f));
}
document.querySelectorAll("#chips .chip-btn").forEach(b => b.addEventListener("click", () => applyFilter(b.dataset.filter)));

// Kiosk-Modus (?kiosk=1): für Bürgerbüro-Bildschirm/Schaufenster. Bedienleisten aus
// (wie embed) und die Themenfilter automatisch durchrotieren — keine Bedienung nötig.
function startKiosk() {
  document.body.classList.add("embed");
  const filters = ["", "wetter", "umwelt", "mobilitaet", "energie", "service"];
  let i = 0;
  setInterval(() => { i = (i + 1) % filters.length; applyFilter(filters[i]); }, 15000);
}

const kommuneConn = ags => CONN.filter(c => c.active !== false && Array.isArray(c.enabledFor) && c.enabledFor.includes(ags));
const landProvides = () => new Set(CONN.filter(c => c.active !== false && c.enabledFor === "*").flatMap(c => c.provides || []));

async function render() {
  const [, name, lat, lon, krs, typ, ew, dashUrl, slug] = STADT.row;
  const ags = STADT.row[0];
  const cfg = DASH[slug] || {};
  const adoptiert = cfg.adoptiert === true;
  document.title = `Smart City ${name} — Live-Dashboard`;
  $("#title").textContent = name;
  $("#subtitle").innerHTML = `${typ === "S" ? "Stadt" : typ === "F" ? "Gemeindefreies Gebiet" : "Gemeinde"} · ${fmtN(ew)} Einwohner <a class="searchlink" href="/mitmachen.html" style="color:var(--text-muted)">· Kommunen-Suche</a>`;
  $("#disclaimer").textContent = adoptiert
    ? "In Kooperation mit der Kommune · Datenquellen siehe Fußzeile"
    : "Inoffizielles Angebot aus offenen Daten — die Kommune kann dieses Dashboard kostenlos übernehmen und gestalten.";
  if (cfg.branding) {
    for (const [k, v] of Object.entries(cfg.branding)) {
      if (k === "primary") document.documentElement.style.setProperty("--tile", v);
      if (k === "accent") document.documentElement.style.setProperty("--accent", v);
      if (k === "theme") document.documentElement.dataset.theme = v;
    }
  }

  const komm = kommuneConn(ags);
  // Kommunenspezifische UND landesweite Bausteine: Seit dem Ausbau um eigene Datenquellen
  // liefern Landeskonnektoren (enabledFor "*") Dinge, die früher je Kommune
  // eingerichtet werden mussten — B+R, Ladestatus, Carsharing, Abfahrten.
  const provides = new Set([...komm.flatMap(c => c.provides || []), ...landProvides()]);
  // kommunenspezifische Konnektoren, die die Kachel-/Detaildaten bestimmen. Vorgezogen,
  // damit ALLE Abrufe in EINEM Promise.all parallel laufen (früher zwei
  // sequentielle Blöcke → unnötige Latenz).
  const findC = p => komm.find(c => (c.provides || []).includes(p))
    || CONN.find(c => c.active !== false && c.enabledFor === "*" && (c.provides || []).includes(p));
  const amtlC = findC("amtliche-station"), carsharingC = findC("carsharing-detail"),
        passantenC = findC("passanten"), ladenDetailC = findC("laden-detail");
  // Geo-Abfrage statt landesweitem limit=1000: nur Entitäten im Umkreis holen und
  // serverseitig auf die benötigten Attribute projizieren (spart je Aufruf
  // hunderte KB — Pegel 198 KB → 1,7 KB, DWD 145 KB → 1,5 KB).
  const near = (type, radiusM, attrs) =>
    jlist(`${SC.GW}/ngsi-ld/v1/entities?type=${type}&georel=near%3BmaxDistance%3D%3D${radiusM}` +
          `&geometry=Point&coordinates=%5B${lon}%2C${lat}%5D&limit=200&attrs=${attrs}`);
  // Entity ids, also for SC.failed(id): a failed query is not "no data".
  const ID = { wx: "urn:ngsi-ld:WeatherObserved:bw-" + ags, dwd: "urn:ngsi-ld:Alert:bw-kreis-" + krs + "-dwd",
    nina: "urn:ngsi-ld:Alert:bw-kreis-" + krs + "-nina", pv: "urn:ngsi-ld:EnergyMonitor:bw-" + ags,
    pulse: "urn:ngsi-ld:CityPulse:bw-" + ags, rathaus: "urn:ngsi-ld:CivicStructure:bw-" + ags + "-rathaus",
    ausflug: "urn:ngsi-ld:TouristDestination:bw-" + ags, fc: "urn:ngsi-ld:WeatherForecast:bw-" + ags,
    versorgung: "urn:ngsi-ld:PublicAmenity:bw-" + ags,
    passant: passantenC && passantenC.sampleEntity ? passantenC.sampleEntity : null };
  const mark = SC.loadMark();

  const [wx, alertDwd, alertNina, luft, parken, sharing, laden, rad, pv, pulse, ptStops, abfahrten, bikeP, kreisRw, allePegel, pollenAll, rathaus, ausflug,
         dwdSt, flotten, passant, chStations, fcEnt, csStations, hitzeAll, versorgung, wasteC, parkSites] = await Promise.all([
    entity(ID.wx), entity(ID.dwd), entity(ID.nina),
    byAgs("AirQualityObserved", ags), byAgs("ParkingSummary", ags),
    byAgs("SharingSummary", ags), byAgs("ChargingSummary", ags), byAgs("TrafficFlowObserved", ags),
    entity(ID.pv), entity(ID.pulse),
    provides.has("departures") ? byAgs("PublicTransportStop", ags) : [],
    // Abfahrten auf Anfrage: liefert für JEDE Gemeinde eine sekundenaktuelle Liste.
    // 404 = no stop for this municipality (no card); any other failure (502
    // upstream error, 503 busy, 429) is marked { gestoert } instead of dropped.
    // Retried on 429 and network errors only: the service keeps an EFA
    // failure for 30 s anyway.
    SC.fetchRetry("/abfahrten?ags=" + ags, undefined, s => s === 429)
      .then(r => r.status === 404 ? null : r.ok ? r.json()
        : r.json().then(j => ({ gestoert: true, halt: j && typeof j.halt === "string" ? j.halt : "" })))
      .catch(() => ({ gestoert: true })),
    provides.has("br") ? byAgs("BikeParking", ags) : [],
    // Baustellen im ganzen Kreis (enthält die eigenen bereits) — die separate
    // ags-Abfrage entfällt, rw/rwUmland werden daraus abgeleitet.
    jlist(`${SC.GW}/ngsi-ld/v1/entities?type=RoadWork&q=ags~%3D%5E${krs}&limit=1000` +
          `&attrs=name,ags,gemeindeName,endDate,description,location`),
    // Pegel im 20-km-Umkreis (Gewässer enden nicht an Gemeindegrenzen); der eigene
    // Pegel wird per ags aus dieser Liste abgeleitet, keine zweite Abfrage.
    // Only WSV/PEGELONLINE gauges: the LUBW flood centre (HVZ) asks third
    // parties not to republish its current readings, so pegel-lubw is off and
    // gauges it wrote before (bw-hvz-*) are never shown, until they are deleted.
    near("WaterLevelObserved", 20000, "name,water,level,levelState,floodLevels,measuredAt,dataProvider,ags,location")
      .then(list => failed(list) ? list : list.filter(e => !String(e.id).includes(":bw-hvz-"))),
    jlist(`${SC.GW}/ngsi-ld/v1/entities?type=PollenForecast&limit=5`),
    entity(ID.rathaus), entity(ID.ausflug),
    // Amtliche DWD-Stationen im 30-km-Umkreis (statt aller ~183 landesweit).
    amtlC ? near("WeatherObserved", 30000, "stationName,temperature,relativeHumidity,dwdStationId,location") : [],
    carsharingC ? byAgs("FleetStatus", ags) : [],
    // Also asked for while the connector is "pending": that flag is fixed in the
    // image, the token arrives at runtime – skipping it would hide the tile
    // although data exists. Its 404 is "no data" (no error tile) and briefly
    // cached by the cockpit nginx.
    ID.passant ? entity(ID.passant) : null,
    // Ladestandorte der Gemeinde, auf Kartenattribute projiziert (statt vollem NGSI-LD).
    ladenDetailC ? byAgs("EVChargingStation", ags, "name,operator,socketNumber,availableEvse,chargingEvse,defectEvse,liveEvse,ags,location,dateObserved") : [],
    entity(ID.fc),
    carsharingC ? byAgs("CarSharingStation", ags, "name,operator,vehicleType,availableVehicles,capacity,ags,location,dateObserved") : [],
    // Hitzebelastung: 5 DWD-Vertreterstädte, nächstgelegene wird gewählt.
    jlist(`${SC.GW}/ngsi-ld/v1/entities?type=HeatHealthWarning&limit=10&options=keyValues`),
    // Familie & Versorgung (OSM): Apotheke, Arzt, Kita, Spielplatz, AED, Trinkwasser.
    entity(ID.versorgung),
    // Container fill levels (FIWARE WasteContainer). There is no open state-wide
    // source: asked only where a registry connector provides "fuellstand" or
    // dashboards.json enables it for the municipality (own sensor feed), see
    // docs/staedte-hinzufuegen.md.
    provides.has("fuellstand") || cfg.fuellstand === true ? byAgs("WasteContainer", ags) : [],
    // Parkanlagen je Standort mit Koordinaten (MobiData BW ParkAPI, kommunenspezifischer Baustein)
    // für die Parken-Detailkarte und die Parken-Kartenebene. Die ParkingSummary oben
    // bleibt der aggregierte Kachelwert.
    byAgs("ParkingSite", ags, "name,totalSpotNumber,availableSpotNumber,category,ags,location,dateObserved"),
  ]);
  SC.loadBanner("#loadwarn", mark);
  // Baustellen: eigene Gemeinde vs. Umland aus der einen Kreis-Abfrage ableiten.
  const rw = kreisRw.filter(e => !e.id.endsWith("summary") && val(e, "ags") === ags);
  const rwUmland = kreisRw.filter(e => !e.id.endsWith("summary") && val(e, "ags") !== ags && pos(e));
  // Eigene Pegel = die im Gemeindegebiet (ags) aus der Umkreis-Liste.
  const pegel = allePegel.filter(e => val(e, "ags") === ags);
  const warnCount = (val(alertDwd, "activeCount") || 0) + (val(alertNina, "activeCount") || 0);
  const maxSev = Math.max(val(alertDwd, "maxSeverity") || 0, val(alertNina, "maxSeverity") || 0);
  // Bürgersensoren nur zeigen, wenn sie aktuell liefern. Der Konnektor läuft alle
  // 15 min; ist der Wert älter als 2 h, sendet in dieser Gemeinde kein Sensor mehr
  // (ausgefallen oder als unplausibel verworfen) — dann lieber nichts anzeigen als
  // einen alten Wert als heutige Luftqualität auszugeben.
  const dObs = e => { const v = e && e.dateObserved && e.dateObserved.value; return v ? (v["@value"] || v) : null; };
  // "Echtzeit" only while the value is current: twice the refresh period of the
  // connector (parken-bw every 3 h; carsharing and charge point stations as
  // well as the charging sums refresh unchanged values every 3 h).
  // Open-Meteo weather and forecast (wetter-bw, vorhersage-bw) refresh every
  // OM_TAKT_H hours; current until two runs are missing, plus an hour of margin.
  const OM_TAKT_H = 6;
  // UBA: dateObserved is the end of the measurement hour; UBA publishes it up to
  // an hour late and uba-bw fetches hourly — older than 4 h means UBA missed a
  // publication (the same limit as the city pulse).
  const STALE = { parken: 6 * 3600e3, station: 6 * 3600e3, laden: 6 * 3600e3, uba: 4 * 3600e3, wetter: (2 * OM_TAKT_H + 1) * 3600e3 };
  const scAlle = luft.find(e => e.id.includes("bw-sc-"));
  const scZeit = Date.parse(dObs(scAlle) || "");
  const sc = (scAlle && scZeit && Date.now() - scZeit < 2 * 3600e3) ? scAlle : null;
  // UBA: the station with the worst (highest) index of the municipality, current
  // stations first. Freshness from dateObserved (the hour of the index); an entity
  // written before uba-bw set it falls back to its newest observedAt.
  const ubaCands = luft.filter(e => e.id.includes("bw-uba-"));
  const ubaStand = e => staleStand(e.dateObserved ? { dateObserved: e.dateObserved } : e, STALE.uba);
  const ubaRank = e => (aqiOf(e) == null ? -10 : aqiOf(e)) + (ubaStand(e) ? -5 : 0);
  const uba = ubaCands.slice().sort((a, b) => ubaRank(b) - ubaRank(a))[0] || null;
  const pk = parken[0], ch = laden[0];
  const radSum = rad.find(e => e.id.endsWith("-summary"));
  // Free-floating sharing vehicles: total of all providers, split by form factor
  // where every summary carries the split (else the total only).
  const shSplit = sharingSplit(sharing.map(e => [val(e, "availableVehicles"), val(e, "vehiclesByFormFactor")]));
  const shSum = shSplit.total;

  const fcDays = asRows(val(fcEnt, "days"));
  // Stations-Entitäten der eigenen Stadt (IDs tragen den Slug als Präfix)
  const chList = (chStations || []).filter(e => !e.id.endsWith("status-summary"));
  // Livesumme der Gemeinde: das Aggregat trägt sie seit dem landesweiten Ausbau
  // selbst; die frühere kommunenspezifische Summen-Entität entfällt.
  const l2 = (ch && val(ch, "liveEvse")) ? ch : null;
  // Nächstgelegene amtliche Station wählen; die Entfernung wird im Hinweis
  // genannt, damit niemand einen 30 km entfernten Messwert für den eigenen hält.
  const kmZu = e => {
    const p = pos(e); if (!p) return Infinity;
    const dy = (p.lat - lat) * 111, dx = (p.lon - lon) * 111 * Math.cos(lat * Math.PI / 180);
    return Math.sqrt(dy * dy + dx * dx);
  };
  const w2 = (dwdSt || []).filter(e => pos(e) && val(e, "temperature") != null)
    .sort((a, b) => kmZu(a) - kmZu(b))[0] || null;
  const w2km = w2 ? Math.round(kmZu(w2) * 10) / 10 : null;
  const w2Name = w2 ? (val(w2, "stationName") || "DWD") : "";

  // Mehrere Anbieter je Gemeinde möglich (stadtmobil, teilAuto, Ford-Carsharing …):
  // Kachel zeigt die Summe, der Verlauf die stärkste Flotte.
  // Die GBFS-Landesliste mischt Auto- und Radverleih. Nur Autos zählen als
  // Carsharing; stationsgebundene Räder erscheinen als eigene Kachel.
  const bauform = e => val(e, "vehicleType") || "car";
  const alleFlotten = (flotten || []).filter(e => val(e, "availableVehicles") != null);
  const csFlotten = alleFlotten.filter(e => bauform(e) === "car");
  // Nur echte Räder als Leihrad-Kachel. E-Scooter und Mopeds stecken bereits in
  // der Sharing-Kachel (frei flottierend) — sie hier erneut zu zählen wäre
  // doppelt und würde »Leihräder« falsch benennen. Conversely, Sharing leaves out
  // bikes docked in a station-based system (sharing-bw).
  const isBike = e => ["bicycle", "cargo_bicycle"].includes(bauform(e));
  const radFlotten = alleFlotten.filter(isBike);
  // Stations split by form factor like the fleets: the GBFS systems of bikes
  // and scooters (RegioRad, Dott, Voi …) land in CarSharingStation too. Only
  // car stations are car sharing; docked bikes get the "Leihräder" layer,
  // scooter stations none (their vehicles are on the Sharing layers).
  const csList = (csStations || []).filter(e => bauform(e) === "car");
  const bikeStations = (csStations || []).filter(isBike);
  const summe = (arr, a) => arr.reduce((n, e) => n + (Number(val(e, a)) || 0), 0);
  const csFrei = summe(csFlotten, "availableVehicles"), csStationen = summe(csFlotten, "stationCount");
  const csTop = csFlotten.slice().sort((a, b) => (val(b, "availableVehicles") || 0) - (val(a, "availableVehicles") || 0))[0];
  // Ladepunkt-Anzeige: online = grün (Station liefert Livedaten), offline = grau
  // (reiner Registereintrag ohne Live-Status). Die Feinaufschlüsselung
  // frei/belegt/defekt bleibt im Popup-Text erhalten.
  const evStatus = e => {
    const live = val(e, "liveEvse") || 0;
    if (!live) return { color: css("--text-muted"), online: false, txt: "offline · keine Livedaten (Registereintrag)" };

  tiles += failed(ID.wx) ? errorTile("Temperatur", { topic: "wetter" }) + errorTile("Wind", { topic: "wetter" }) :

  }

  // today's; tomorrow is in the hint (so with only tomorrow elevated the tile
