  // nächste Pegel am selben Fluss, auch wenn er im Nachbarort steht).
  const kmVon = e => {
    const p = pos(e); if (!p) return Infinity;
    const dy = (p.lat - lat) * 111, dx = (p.lon - lon) * 111 * Math.cos(lat * Math.PI / 180);
    return Math.sqrt(dy * dy + dx * dx);
  };
  const eigene = pegel.filter(e => pos(e));
  const nahe = allePegel.filter(e => pos(e) && kmVon(e) <= 20).sort((a, b) => kmVon(a) - kmVon(b));
  const pegelListe = eigene.length ? eigene : nahe.slice(0, 3);
  if (pegelListe.length) {
    const pg = pegelListe[0];
    const fremd = !eigene.length;
    const dist = fremd ? Math.round(kmVon(pg) * 10) / 10 : null;
    const stufen = asArray(val(pg, "floodLevels"));
    D.pegel = { kind: "chart", title: "Pegel " + (val(pg, "name") || ""), unit: " cm",
      explain: "Wasserstand" + (stufen.length ? " · erste Hochwasser-Meldestufe bei " + stufen[0] + " cm" : "") +
        " (Bundeswasserstraßen, WSV/PEGELONLINE). Landespegel und Hochwasservorhersage: LUBW Hochwasservorhersagezentrale.",
      series: pegelListe.map(e => ({ id: e.id, attr: "level", name: (val(e, "name") || "") + " (" + (val(e, "water") || "") + ")" })) };
    // Pegel-Kachel entfernt; die Pegel-Kartenebene bleibt (Popup öffnet den Verlauf).
  }
  // State gauges and flood forecasts are not republished here (HVZ terms):
  // a link to the LUBW flood centre takes their place, on every page.
  tiles += linkTile("Pegel & Hochwasser", HVZ_URL, "Pegelstände und Hochwasservorhersage: LUBW Hochwasservorhersagezentrale",
    "umwelt", false, "Amtliches Angebot des Landes — öffnet extern (hvz.lubw.baden-wuerttemberg.de).");
  // === Verwaltung & Bürgerservice: die vier Pflicht-Kacheln IMMER rendern ===
  // Wo die Kommune nichts bereitstellt, bleibt die Kachel als sichtbares
  // Ausbaupotenzial stehen (emptyTile) statt zu verschwinden.
  const amtWeb = (SERVICES[ags] || {}).website;
  // 1) Rathaus & Bürgerbüro: OSM-Öffnungszeiten bevorzugt, sonst amtliche Website,
  //    sonst Potenzial-Hinweis.
  const oh = rathaus ? val(rathaus, "openingHours") : null;
  if (oh) {
    const t = ohToday(oh);
    D.rathaus = { kind: "table", title: val(rathaus, "name") || "Rathaus",
      header: ["", ""], rows: [["Öffnungszeiten", esc(oh)],
        ...(val(rathaus, "telephone") ? [["Telefon", esc(val(rathaus, "telephone"))]] : []),
        ...(val(rathaus, "url") || amtWeb ? [["Web", `<a href="${esc(safeUrl(val(rathaus, "url") || amtWeb))}" target="_blank" rel="noopener">${esc(val(rathaus, "url") || amtWeb)}</a>`]] : [])],
      note: "Öffnungszeiten aus OpenStreetMap (ODbL) — ohne Gewähr." };
    // Kurzform statt „geschlossen“: öffnet es heute noch, steht die Uhrzeit da.
    const wert = !t ? "Zeiten ansehen"
      : t.open ? "geöffnet"
      : t.next != null ? "ab " + String(Math.floor(t.next / 60)).padStart(2, "0") + ":" + String(t.next % 60).padStart(2, "0")
      : "geschlossen";
    tiles += tile("Rathaus & Bürgerbüro", wert, "",
      { topic: "service", detail: "rathaus", status: t ? (t.open ? css("--status-good") : css("--text-muted")) : null,
        hint: esc(t ? t.text : String(oh).slice(0, 34)),
        explain: "Öffnungszeiten laut OpenStreetMap — ohne Gewähr. Klick: Details und Kontakt." });
  } else if (amtWeb) {
    tiles += linkTile("Rathaus & Bürgerbüro", amtWeb, "Amtliche Website: Öffnungszeiten, Kontakt, Formulare");
  } else if (failed(ID.rathaus)) {
    tiles += errorTile("Rathaus & Bürgerbüro", { topic: "service" });
  } else {
    tiles += emptyTile("Rathaus & Bürgerbüro", "Öffnungszeiten & Kontakt");
  }
  // 2) Mängelmelder + 3) Müllabfuhr gehören zum Bürgerservice (Filter »Service«),
  //    Veranstaltungen zur Freizeit — kuratierter Link oder Potenzial-Kachel.
  const svcLinks = [
    ["maengelmelder", "Mängel melden", "Schäden & Anliegen online melden", "service"],
    ["abfall", "Müllabfuhr", "Abfuhrtermine je Straße", "service"],
    ["veranstaltungen", "Veranstaltungen", "Städtischer Veranstaltungskalender", "freizeit"],
  ];
  // Diese drei Bürgerservice-Kacheln tragen denselben vollen Kachel-Hintergrund
  // wie die Datenkacheln (plain), statt der Akzent-/Potenzial-Sonderoptik.
  for (const [key, label, potential, topic] of svcLinks) {
    const url = cfg.links && cfg.links[key];
    tiles += url ? linkTile(label, url, potential, topic, true) : emptyTile(label, potential, topic, true);
  }
  // Bäder: optionaler Freizeit-Zusatz, nur wo kuratiert.
  if (cfg.links && cfg.links.baeder) tiles += linkTile("Bäder", cfg.links.baeder, "Öffnungszeiten & Auslastung", "freizeit");
  // Familie & Versorgung (OSM): Apotheke, Arzt, Kita, Spielplatz, AED, Trinkwasser.
  const versorgItems = versorgung ? asRows(val(versorgung, "amenities")) : [];
  if (versorgItems.length) {
    const counts = (versorgung && val(versorgung, "counts")) || {};
    const FARBE = { Apotheke: "#e11d48", Arztpraxis: "#0891b2", Kita: "#7c3aed",
      Spielplatz: "#16a34a", Defibrillator: "#dc2626", Trinkwasser: "#2563eb",
      Recyclinghof: "#65a30d", Altglas: "#0d9488", "Wertstoff-Container": "#a16207" };
    const summ = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    D.versorgung = { kind: "stations", title: "Familie & Versorgung", center: [lat, lon],
      explain: "Apotheken, Arztpraxen, Kitas, Spielplätze, Defibrillatoren und Trinkwasser laut OpenStreetMap (ODbL): "
        + summ.map(([a, n]) => n + "× " + a).join(", ") + ".",
      groups: [{ name: "Versorgung", items: versorgItems.map(z => ({ lat: z[2], lon: z[3], name: z[0], kind: z[1], extra: esc(z[1]), color: FARBE[z[1]] || "#64748b" })) }],
      list: versorgItems.slice(0, 60).map(z => `<b>${esc(z[0])}</b> · <span style="color:var(--text-muted)">${esc(z[1])}</span>`) };
    // Total = sum over all kinds; the list (amenities) is capped at 50.
    const amenityTotal = summ.reduce((n, [, c]) => n + (Number(c) || 0), 0) || val(versorgung, "totalCount") || versorgItems.length;
    tiles += tile("Familie & Versorgung", amenityTotal, "", { topic: "service", detail: "versorgung",
      hint: esc(summ.slice(0, 3).map(([a, n]) => n + "× " + a).join(" · ")) || "OSM",
      explain: "Einrichtungen der Daseinsvorsorge im Gemeindegebiet laut OpenStreetMap. Klick: Karte + Liste nach Art." });
  }
  // === Container-/Behälter-Füllstände (FIWARE WasteContainer.fillingLevel) ===
  // Altglas-/Wertstoffcontainer und Abfallbehälter mit Sensor-Füllstand. Für BW gibt
  // es dafür keine offenen Daten (die LoRaWAN-Werte liegen beim Entsorger) — die
  // Ebene bleibt leer, bis eine Kommune ihren Feed anbindet, und erscheint dann von
  // selbst. Ampel: grün < 60 % · gelb 60–85 % · rot ≥ 85 %.
  const fillPct = e => { const f = val(e, "fillingLevel"); return f == null ? null : Math.round(f <= 1 ? f * 100 : f); };
  const fillCol = p => p >= 85 ? css("--status-serious") : p >= 60 ? css("--status-warn") : css("--status-good");
  const fillArt = e => val(e, "category") || val(e, "wasteType") || val(e, "refWasteType") || "Behälter";
  const fuellVoll = (wasteC || []).filter(e => fillPct(e) != null && e.location);
  if (fuellVoll.length) {
    const fMarks = fuellVoll.map(e => { const p = fillPct(e); return { ...pos(e), name: val(e, "name") || fillArt(e),
      extra: esc(fillArt(e)) + " · Füllstand " + p + " %", color: fillCol(p), fill: p }; }).filter(i => i.lat);
    const nahVoll = fuellVoll.filter(e => fillPct(e) >= 85).length;
    const avgFill = Math.round(fuellVoll.reduce((s, e) => s + fillPct(e), 0) / fuellVoll.length);
    const FILL_STOPS = [[0, 60, "var(--status-good)"], [60, 85, "var(--status-warn)"], [85, 100, "var(--status-serious)"]];
    D.fuellstand = { kind: "stations", title: "Container-Füllstände", center: [lat, lon],
      explain: "Füllstände von Altglas-/Wertstoffcontainern und Abfallbehältern (FIWARE WasteContainer, LoRaWAN-Sensorik). Ampel: grün < 60 % · gelb 60–85 % · rot ≥ 85 %.",
      groups: [{ name: "Container-Füllstände", color: css("--status-warn"), items: fMarks }],
      list: fuellVoll.slice().sort((a, b) => fillPct(b) - fillPct(a)).slice(0, 60)
        .map(e => `<b>${esc(val(e, "name") || fillArt(e))}</b> · <span style="color:${fillCol(fillPct(e))}">${fillPct(e)} % voll</span>`) };
    tiles += tile("Container-Füllstände", avgFill, "%", { topic: "umwelt", detail: "fuellstand",
      status: nahVoll > 0 ? css("--status-serious") : css("--status-good"),
      mini: { v: avgFill, min: 0, max: 100, stops: FILL_STOPS },
      hint: fuellVoll.length + " Behälter · " + nahVoll + " fast voll (≥ 85 %)",
      explain: "Durchschnittlicher Füllstand von Altglas-/Wertstoffcontainern und Abfallbehältern; Tacho = Ø, Zahl »fast voll« = ≥ 85 %. Klick: Karte + Liste nach Füllstand." });
  }
  // Ausflugsziele (OSM) — Freizeit. Detailansicht mit Aufschlüsselung nach Art.
  const ziele = ausflug ? asRows(val(ausflug, "ziele")) : [];
  if (ziele.length) {
    // Nach Art aufschlüsseln (Sehenswürdigkeit, Museum, Aussichtspunkt, …).
    const nachArt = {};
    ziele.forEach(z => { const a = z[1] || "Ziel"; nachArt[a] = (nachArt[a] || 0) + 1; });
    const artTop = Object.entries(nachArt).sort((a, b) => b[1] - a[1]);
    const artHint = artTop.slice(0, 3).map(([a, n]) => n + "× " + a).join(" · ");
    const zielGesamt = val(ausflug, "zielCount") || ziele.length;
    D.ausflug = { kind: "stations", title: "Ausflugsziele (" + ziele.length + ")", center: [lat, lon],
      explain: "Benannte Ausflugsziele laut OpenStreetMap (ODbL): " + artTop.map(([a, n]) => n + "× " + a).join(", ") + "."
        + (zielGesamt > ziele.length ? " Angezeigt: die " + ziele.length + " meistgenannten von " + fmtN(zielGesamt) + "." : ""),
      groups: [{ name: "Ausflugsziele", color: MAP_C.ausflug, detail: D.ausflug ? "ausflug" : null, items: ziele.map(z => ({ lat: z[2], lon: z[3], name: z[0], extra: esc(z[1]) })) }],
      // Zusätzlich zur Karte eine benannte Liste (Name · Art) im Detail.
      list: ziele.slice(0, 60).map(z => `<b>${esc(z[0])}</b> · <span style="color:var(--text-muted)">${esc(z[1])}</span>`) };
    tiles += tile("Ausflugsziele", Math.max(zielGesamt, ziele.length), "", { topic: "freizeit", detail: "ausflug",
      hint: esc(artHint) || "OSM",
      explain: "Benannte Ausflugsziele im Gemeindegebiet laut OpenStreetMap"
        + (zielGesamt > ziele.length ? "; angezeigt werden " + ziele.length + " von " + fmtN(zielGesamt) + "." : ".") + " Klick: Karte + Liste nach Art." });
  }
  // Parken-Kartenpunkte: je Anlage ein Standort mit Kapazität und — wo gemeldet —
  // freien Plätzen. Für die Detailkarte und die Parken-Kartenebene.
  const parkPts = (parkSites || []).map(e => ({ ...pos(e), name: val(e, "name") || "Parkplatz",
    frei: val(e, "availableSpotNumber"),
    extra: (val(e, "totalSpotNumber") != null ? fmtN(val(e, "totalSpotNumber")) + " Stellplätze" : "Parkplatz")
      + (val(e, "availableSpotNumber") != null ? " · " + mitStand(fmtN(val(e, "availableSpotNumber")) + " frei", e, STALE.parken) : "") })).filter(i => i.lat);
  if (pk) {
    // Freshness of the realtime sum only: parken-bw refreshes dateObserved while
    // realtime exists, and a summary without realtime leaves the old realtimeFree
    // in the broker (upsert = update) while siteCount gets a new observedAt.
    const pkStand = val(pk, "realtimeFree") != null
      ? staleStand({ dateObserved: pk.dateObserved, realtimeFree: pk.realtimeFree }, STALE.parken) : "";
    if (parkPts.length) {
      // Bevorzugt: Standortkarte der Parkanlagen (kommunenspezifischer Baustein mit Koordinaten).
      D.parken = { kind: "stations", title: "Parken", center: [lat, lon],
        explain: "Parkanlagen mit Standort und — wo gemeldet — freien Plätzen " + (pkStand ? "(" + pkStand + ")" : "in Echtzeit") + " (MobiData BW ParkAPI).",
        groups: [{ name: "Parken", color: MAP_C.parken, items: parkPts.map(p => ({ ...p, extra: esc(p.extra) })) }],
        list: parkPts.slice(0, 60).map(p => `<b>${esc(p.name)}</b> · <span style="color:var(--text-muted)">${esc(p.extra)}</span>`) };
    } else if (val(pk, "realtimeFree") != null) {
      // Ohne Anlagen-Koordinaten ersatzweise der Belegungsverlauf.
      D.parken = { kind: "chart", title: "Freie Parkplätze", explain: pkStand ? "Belegung (MobiData BW), " + pkStand + "." : "Echtzeit-Belegung (MobiData BW).", zero: true, series: [{ id: pk.id, attr: "realtimeFree", name: "frei" }] };
    }
    // Main value: free spaces while the realtime sum is current; else the
    // capacity, labelled "Stellplätze".
    const parkFree = val(pk, "realtimeFree"), parkSites = fmtN(val(pk, "siteCount")) + (val(pk, "siteCount") === 1 ? " Anlage" : " Anlagen");
    const parkLive = parkFree != null && !pkStand;
    tiles += tile("Parken", fmtN(parkLive ? parkFree : val(pk, "totalCapacity")), parkLive ? "frei" : "Stellplätze", { topic: "mobilitaet", detail: D.parken ? "parken" : null,
      status: parkLive ? css("--status-good") : null,
      hint: parkLive
        ? "in " + fmtN(val(pk, "realtimeSites") ?? val(pk, "siteCount")) + " von " + parkSites + " (Echtzeit) · " + fmtN(val(pk, "totalCapacity")) + " Stellplätze"
        : parkSites + (parkFree != null ? " · zuletzt " + fmtN(parkFree) + " frei (" + pkStand + ")" : " · ohne Echtzeit"),
      explain: (parkLive ? "Freie Plätze der Anlagen mit Echtzeit-Belegung; " : "Stellplätze insgesamt; ") + "alle in MobiData BW erfassten Anlagen." + (parkPts.length ? " Klick: Standortkarte der Parkanlagen." : "") });
  }
  // Sharing positions per provider (SharingSummary.vehiclePositions) for the
  // detail map and the map layer below; visible outside the block. Free
  // floating only: sharing-bw leaves out bikes and cars docked at a station of
  // a station-based system, those are on the "Leihräder" / "Carsharing" tiles.
  let scooterGroups = [];
  if (shSum) {
    // Anbietername säubern (System-/Operatorfeld, ohne technische Suffixe).
    const provName = e => String(val(e, "operator") || val(e, "system") || e.id.split("-ff-").pop() || "Anbieter").split("_")[0];
    // Wiedererkennbare Markenfarbe je Anbieter als nominatives Erkennungsmerkmal —
    // KEINE Logo-Reproduktion (Anbieterlogos sind geschützte Marken). Unbekannte
    // Anbieter erhalten eine deterministisch aus dem Namen abgeleitete Farbe.
    const BRAND = { bolt: "#34d186", voi: "#f5654f", dott: "#1f6feb", tier: "#00c9a7", lime: "#32d74b",
      zeus: "#7c3aed", bird: "#1f2937", nextbike: "#005ca9", lidl: "#0050aa" };
    const brandColor = nm => { const k = String(nm).toLowerCase(); if (BRAND[k]) return BRAND[k];
      let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0; return "hsl(" + (h % 360) + ",60%,45%)"; };
    // Standorte je Anbieter als eigene, in Markenfarbe symbolisierte Ebene (scooter:true).
    scooterGroups = sharing.map(e => {
      const nm = provName(e);
      const pts = asRows(val(e, "vehiclePositions"))
        .filter(p => Array.isArray(p) && p[0] != null && p[1] != null)
        .map(p => ({ lat: +p[0], lon: +p[1], name: nm, extra: "Leihfahrzeug · frei flottierend" }));
      return { name: nm, scooter: true, color: brandColor(nm), items: pts };
    }).filter(g => g.items.length);
    // Split by form factor: a sentence for the texts, bars for the detail.
    const splitSentence = shSplit.parts && shSplit.parts.length ? " Davon " + shSplit.text + "." : "";
    const splitBars = shSplit.parts && shSplit.parts.length ? { rows: shSplit.parts.map(p => [p[1], p[2]]), unit: " Fahrzeuge" } : null;
    // Providers with brand colour (by availability, descending) for the detail list.
    const providers = sharing.slice()
      .sort((a, b) => (val(b, "availableVehicles") || 0) - (val(a, "availableVehicles") || 0))
      .filter(e => (val(e, "availableVehicles") || 0) > 0);
    const chips = providers.map(e => { const nm = provName(e); return `<span class="brand" style="background:${brandColor(nm)}">${esc(nm)} ${fmtN(val(e, "availableVehicles") || 0)}</span>`; });
    if (scooterGroups.length) {
      // Preferred: map per provider, the split above it.
      D.sharing = { kind: "stations", title: "Sharing-Standorte", center: [lat, lon],
        explain: "Aktuelle Standorte frei flottierender Leihfahrzeuge je Anbieter (GBFS, stündlich); Marker in der Anbieter-Markenfarbe." + splitSentence,
        bars: splitBars, groups: scooterGroups, list: chips };
    } else {
      // Without positions: the availability over time (explain is plain text).
      D.sharing = { kind: "chart", noSpark: true, title: "Sharing-Verfügbarkeit", zero: true,
        explain: "Verfügbare frei flottierende Leihfahrzeuge je Anbieter im Zeitverlauf." + splitSentence
          + (providers.length ? " Anbieter: " + providers.map(e => provName(e) + " " + fmtN(val(e, "availableVehicles") || 0)).join(", ") + "." : ""),
        series: sharing.map(e => ({ id: e.id, attr: "availableVehicles", name: provName(e) })) };
    }
    // Main value: all free-floating vehicles; hint: the split. Older summaries
    // without a split: the total only, providers as the hint.
    tiles += tile("Sharing", shSum, "", { topic: "mobilitaet", detail: "sharing",
      hint: shSplit.parts && shSplit.parts.length ? esc(shSplit.text) : chips.join(""),
      explain: "Aktuell verfügbare frei flottierende Leihfahrzeuge (GBFS): E-Scooter, Räder, Mopeds und Autos ohne feste Station." + splitSentence
        + " An Stationen angedockte Räder zählt die Kachel »Leihräder«. Klick: "
        + (scooterGroups.length ? "Aufteilung und Standortkarte je Anbieter." : "Zeitverlauf je Anbieter.") });
  }
  if (ch) {
    const live = l2 ? val(l2, "availableEvse") : null;
    const chStand = l2 ? staleStand(l2, STALE.laden) : "";
    const pts = chList.map(e => { const st = evStatus(e); return { ...pos(e), color: st.color, name: val(e, "name"), online: st.online, legend: st.online ? "online" : "offline",
      extra: esc(String(val(e, "socketNumber") ?? "?") + " Ladepunkte · " + (val(e, "operator") || "")) + "<br>" + st.txt }; }).filter(i => i.lat);
    // Online/Offline als getrennte, ein-/ausblendbare Ebenen
    if (pts.length) D.laden = { kind: "stations", title: "Ladestandorte", center: [lat, lon],
      explain: "Ladestandorte mit Live-Status (MobiData BW/OCPDB) — grün = online (liefert Livedaten), grau = offline (reiner Registereintrag). Ebenen einzeln ein-/ausblendbar. Die Feinaufteilung frei/belegt/defekt steht im Popup. Die Kachel »Ladepunkte« zählt dagegen das vollständige BNetzA-Register.",
      groups: [
        { name: "Ladepunkte online", color: css("--status-good"), items: pts.filter(p => p.online) },
        { name: "Ladepunkte offline", color: css("--text-muted"), items: pts.filter(p => !p.online) },
      ].filter(g => g.items.length) };
    else if (l2) D.laden = { kind: "chart", title: "Ladepunkte frei (live)", explain: "Freie Ladepunkte im Zeitverlauf.", zero: true, series: [{ id: l2.id, attr: "availableEvse", name: "frei" }] };
    tiles += tile("Ladepunkte", fmtN(val(ch, "evseCount")), "", { topic: "energie", detail: D.laden ? "laden" : null,
      status: live == null ? null : chStand ? css("--text-muted") : live > 0 ? css("--status-good") : css("--status-warn"),
      hint: fmtN(val(ch, "locationCount")) + (val(ch, "locationCount") === 1 ? " Standort" : " Standorte") + (live != null ? " · " + fmtN(live) + " frei " + (chStand ? "(" + chStand + ")" : "(live)") : ""),
      explain: "E-Ladepunkte laut BNetzA-Register; Live-Status (frei/belegt/defekt), wo Betreiber melden." });
  }
  if (radSum) {
    const last7 = asRows(val(radSum, "last7Days"));
    D.radverkehr = { kind: "stations", title: "Radverkehr", explain: "Zählstellen-Standorte und Tagesverlauf der letzten Woche.", center: [lat, lon],
      groups: [{ name: "Radzählstellen", color: MAP_C.rad, detail: D.radverkehr ? "radverkehr" : null, items: rad.filter(e => !e.id.endsWith("summary")).map(e => ({ ...pos(e), name: val(e, "name"), extra: fmtN(val(e, "dailyTotal")) + " Fahrten" })).filter(i => i.lat) }],
      bars: last7.length ? { rows: last7.map(([d, v]) => [String(d).slice(5), v]), unit: " Fahrten" } : null };
    // dateObserved of the sum is the counting day (eco-bw), not the fetch time.
    const countDay = dObs(radSum);
    tiles += tile("Radverkehr", fmtN(val(radSum, "dailyTotal")), "", { topic: "mobilitaet", detail: "radverkehr",
      hint: fmtN(val(radSum, "siteCount")) + (val(radSum, "siteCount") === 1 ? " Zählstelle" : " Zählstellen") + (countDay ? " · am " + fmtDay(countDay) : ""),
      explain: "Radfahrten am letzten verfügbaren Tag (Eco-Counter)" + (countDay ? ", hier am " + fmtDay(countDay) : "") + "." });
  }
  if (val(pv, "installedCapacityKw") > 0) {
    const adds = asRows(val(pv, "additionsByYear"));
    if (adds.length) D.pv = { kind: "bars", title: "PV-Zubau nach Jahr", explain: "Neu in Betrieb genommene PV-Leistung je Jahr (MaStR).", unit: " kW", rows: adds.map(([y, cnt, kw]) => [String(y), kw]) };
    tiles += tile("PV installiert", (val(pv, "installedCapacityKw") / 1000).toFixed(1).replace(".", ","), "MW",
      { topic: "energie", detail: adds.length ? "pv" : null, hint: fmtN(val(pv, "plantCount")) + " Anlagen (MaStR)", explain: "Photovoltaik-Gesamtleistung laut Marktstammdatenregister." });
    // CO₂-Kennzahl (berechnet): kWp × 950 kWh/kWp·a (Ertrag Süddeutschland) × 0,4 kg CO₂/kWh (verdrängter Strommix)
    const co2t = Math.round(val(pv, "installedCapacityKw") * 950 * 0.4 / 1000);
    tiles += tile("CO₂ vermieden", fmtN(co2t), "t/Jahr", { topic: "energie",
      hint: "rechnerisch, durch PV", status: css("--status-good"),
      explain: "Rechenweg: installierte PV-Leistung × 950 kWh je kWp und Jahr (typischer Ertrag in Süddeutschland) × 0,4 kg CO₂ je kWh verdrängtem Strommix. Eine Näherung — keine Messung." });
  }

  // Kacheln aus kommunenspezifischen Konnektoren
  if (bikes.length) {
    const brStand = staleStand(bikes, STALE.parken);
    // Detailkarte: Standortkarte der überwachten Fahrradparkplätze (frei/gesamt im Popup).
    D.br = { kind: "stations", title: "B+R Fahrradparken", center: [lat, lon],
      explain: "Überwachtes Fahrradparken (Boxen/Sammelgarage) — Standorte mit freien Plätzen " + (brStand ? "(" + brStand + ")." : "in Echtzeit."),
      groups: [{ name: "B+R Fahrradparken", color: MAP_C.br, items: bikes.map(b => ({ ...pos(b), name: val(b, "name"),
        extra: brExtra(b) })).filter(i => i.lat) }] };
    tiles += tile("B+R Fahrradparken", brFrei, "", { topic: "mobilitaet", detail: D.br.groups[0].items.length ? "br" : null,
      status: brStand ? css("--text-muted") : css("--status-good"),
      hint: brStand ? "freie Plätze · " + brStand : "freie Plätze, Echtzeit",
      explain: "Überwachtes Fahrradparken (Boxen/Sammelgarage) — " + (brStand ? "zuletzt gemeldete freie Plätze, " + brStand : "freie Plätze in Echtzeit") + ". Klick: Standortkarte." });
  }
  if (csFlotten.length) {
    const anbieter = csFlotten.map(e => val(e, "operator")).filter(Boolean);
    // Detailkarte: ausschliesslich die Standortkarte der Carsharing-Stationen
    // (verfügbar/Kapazität im Popup). Ohne Stationsstandorte (frei flottierend)
    // bleibt die Kachel ohne Detailansicht — der frühere Zeitverlauf-Graph
    // zeigte dort nur eine Linie ohne Ortsbezug und ist bewusst entfallen.
    const csPts = csList.map(e => ({ ...pos(e), name: val(e, "name"), extra: csExtra(e) })).filter(i => i.lat);
    if (csPts.length) {
      D.carsharing = { kind: "stations", title: "Carsharing" + (csTop ? " (" + val(csTop, "operator") + ")" : ""), center: [lat, lon],
        explain: "Stationsbasiertes Carsharing" + (anbieter.length ? " (" + anbieter.join(", ") + ")" : "") + " — Standorte mit verfügbaren Fahrzeugen (GBFS).",
        groups: [{ name: "Carsharing", color: MAP_C.carsharing, items: csPts }] };
    }
    tiles += tile("Carsharing", csFrei, "", { topic: "mobilitaet", detail: csPts.length ? "carsharing" : null,
      hint: csStationen + (csStationen === 1 ? " Station" : " Stationen")
            + (anbieter.length > 1 ? " · " + anbieter.length + " Anbieter" : ""),
      explain: "Stationsbasiertes Carsharing" + (anbieter.length ? " (" + anbieter.join(", ") + ")" : "")
               + " — verfügbare Fahrzeuge laut GBFS-Feed der Anbieter." + (csPts.length ? " Klick: Standortkarte." : "") });
  }
  if (radFlotten.length) {
    const radFrei = summe(radFlotten, "availableVehicles"), radSt = summe(radFlotten, "stationCount");
    D.radverleih = { kind: "chart", title: "Leihräder an Stationen", zero: true,
      explain: "Verfügbare Leihräder im Zeitverlauf.",
      series: radFlotten.slice(0, 4).map(e => ({ id: e.id, attr: "availableVehicles", name: val(e, "operator") || "verfügbar" })) };
    tiles += tile("Leihräder", radFrei, "", { topic: "mobilitaet", detail: "radverleih",
      hint: radSt + (radSt === 1 ? " Station" : " Stationen") + " · "
            + esc(radFlotten.map(e => val(e, "operator")).filter(Boolean).join(", ")),
      explain: "Stationsgebundener Radverleih (GBFS) — verfügbare Räder je Station." });
  }
  if (w2) {
    // Amtliche-Station-Kachel entfernt; die Station bleibt als Vergleichsreihe in
    // der Temperatur-Detailkarte (D.temperatur) erhalten.
    D.amtlich = { kind: "chart", title: "Amtliche Station " + w2Name, explain: "Direkt gemessene Stationstemperatur.", unit: " °C", series: [{ id: w2.id, attr: "temperature", name: "Temperatur" }] };
  }
  if (passant && val(passant, "pedestrianCount") != null) {
    D.passanten = { kind: "chart", title: "Passantenfrequenz", explain: "Fußverkehr an der Zählstelle (hystreet).", zero: true, series: [{ id: passant.id, attr: "pedestrianCount", name: "Personen/h" }] };
    tiles += tile("Passanten", fmtN(val(passant, "pedestrianCount")), "/h", { topic: "mobilitaet", detail: "passanten",
      hint: esc(val(passant, "name")) || "Innenstadt", explain: "Passantenfrequenz der letzten Stunde (hystreet) — kommune-spezifischer Konnektor." });
  }
  const deps0 = asArray(val(ptStops[0], "departures"));
  const abfList = (abfahrten && Array.isArray(abfahrten.abfahrten)) ? abfahrten.abfahrten : [];
  // Departure board states besides a list: EFA disturbed vs. simply no departures.
  const abfGestoert = !!(abfahrten && abfahrten.gestoert);
  const abfLeer = !!(abfahrten && Array.isArray(abfahrten.abfahrten) && !abfahrten.abfahrten.length);
  const medDelay = abfahrten && abfahrten.medianVerspaetung != null
    ? abfahrten.medianVerspaetung : val(ptStops[0], "avgDelayMinutes");
  const haltName = (abfahrten && abfahrten.halt) || val(ptStops[0], "name") || "";
  // Die Kachel erscheint nur, wenn tatsächlich Echtzeitmeldungen vorliegen.
  // Ein Halt ohne Echtzeitanbindung hat keine Verspätung von 0 — er hat keine
  // bekannte Verspätung, und das ist etwas anderes.
  const rtZahl = abfahrten && abfahrten.echtzeitAbfahrten != null
    ? abfahrten.echtzeitAbfahrten : (deps0.filter(d => d.delayMinutes != null).length);
  // Abfahrten-Zeilen (Echtzeit bevorzugt) — dienen sowohl der Fahrplan-Detailkarte
  // als auch der Abfahrtstafel weiter unten.
  const zeilen = abfList.length
    ? abfList.map(d => ({ linie: d.linie, ziel: d.ziel, zeit: d.zeit, min: d.verspaetung }))
    : deps0.map(d => ({ linie: d.line, ziel: d.destination, zeit: d.estimated, min: d.delayMinutes }));
  if (zeilen.length) {
    const delayCls = m => m == null ? "delay-0" : m >= 5 ? "delay-s" : m >= 1 ? "delay-w" : "delay-0";
    D.oepnv = { kind: "table", title: "Abfahrten " + haltName,
      header: ["Linie", "Ziel", "Abfahrt", "+min"],
      rows: zeilen.slice(0, 30).map(d => [
        `<span class="line-badge">${esc(d.linie)}</span>`, esc(d.ziel), esc(d.zeit),
        `<span class="${delayCls(d.min)}">${d.min == null ? "?" : Number(d.min) > 0 ? "+" + Number(d.min) : "±0"}</span>`]),
      note: "Nächste Abfahrten am zentralen Halt (EFA-BW), beim Seitenaufruf abgerufen. „?“ = keine plausible Echtzeitmeldung." };
  }
  if (medDelay != null && rtZahl > 0) {
    tiles += tile("ÖPNV-Verspätung", String(Number(medDelay)).replace(".", ","), "min",
      { topic: "mobilitaet", detail: D.oepnv ? "oepnv" : null, status: grade(medDelay, 2, 5),
        hint: esc(haltName) + " · " + fmtN(rtZahl) + " mit Echtzeit",
        explain: "Median der Verspätungen der nächsten Abfahrten am zentralen Halt (EFA-BW, beim Seitenaufruf abgerufen). Nur Abfahrten mit echter Echtzeitmeldung fließen ein — bei den übrigen ist die Verspätung unbekannt, nicht null. Unplausible Meldungen (über 60 min) werden als Datenartefakt ausgeschlossen. Klick: Fahrplan der nächsten Abfahrten." });
  } else if (D.oepnv) {
    // No realtime delay, but departures: the next departure as the value
    // (time · line); the row count was only the query limit. Only a departure
    // still ahead (Berlin clock, HH:MM, across midnight): the fallback list of
    // the PublicTransportStop entity can be older than the page view, and one
    // older than 3 h does not count at all. Nothing ahead: "–" with its stand.
    const clockMin = t => { const [hh, mm] = new Date(t).toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).split(":").map(Number); return hh * 60 + mm; };
    const nowMin = clockMin(Date.now());
    const ahead = d => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(d.zeit || "")); return !!m && ((+m[1] * 60 + +m[2]) - nowMin + 1440) % 1440 < 720; };
    const fromEntity = !abfList.length;
    const entityStand = fromEntity ? staleStand(ptStops[0], 3 * 3600e3) : "";
    const next = entityStand ? null : zeilen.find(ahead);
    const standTxt = fromEntity && obsTime(ptStops[0]) != null ? "Stand " + SC.fmtT(obsTime(ptStops[0])) : "keine anstehende Abfahrt";
    tiles += tile("ÖPNV", next ? String(next.zeit) + (next.linie ? " · " + next.linie : "") : "–", "", { topic: "mobilitaet", detail: "oepnv",
      hint: next ? (next.ziel ? "→ " + esc(next.ziel) + " · " : "") + esc(haltName) : esc(haltName) + " · " + esc(entityStand || standTxt),
      explain: "Nächste Abfahrt am zentralen Halt (EFA-BW), beim Seitenaufruf abgerufen. Klick: Fahrplan der nächsten Abfahrten." });
  }
  $("#tiles").innerHTML = tiles;
  // Optional tiles whose query failed: error state where this municipality
  // normally has the tile (remembered from earlier views), nothing otherwise.
  const tileMem = window._tileMem || (window._tileMem = SC.tileMemory("stadt:" + ags));
  SC.errorTiles("#tiles", [
    ["puls", ["Puls"], failed(ID.pulse)],
    ["luftfeuchte", ["Luftfeuchte"], failed(dwdSt), "wetter"],
    ["uv", ["UV-Index"], failed(ID.fc), "wetter"],
    ["feinstaub", ["Feinstaub PM2.5"], failed(luft), "umwelt"],
    ["luft", ["Luftqualität"], failed(luft), "umwelt"],
    ["no2", ["NO₂"], failed(luft), "umwelt"],
    ["hitze", ["Hitzebelastung"], failed(hitzeAll), "umwelt"],
    ["pollen", ["Pollenflug"], failed(pollenAll), "umwelt"],
    ["fuellstand", ["Container-Füllstände"], failed(wasteC), "umwelt"],
    ["versorgung", ["Familie & Versorgung"], failed(ID.versorgung), "service"],
    ["ausflug", ["Ausflugsziele"], failed(ID.ausflug), "freizeit"],
    ["parken", ["Parken"], failed(parken), "mobilitaet"],
    ["sharing", ["Sharing"], failed(sharing), "mobilitaet"],
    ["rad", ["Radverkehr"], failed(rad), "mobilitaet"],
    ["br", ["B+R Fahrradparken"], failed(bikeP), "mobilitaet"],
    ["carsharing", ["Carsharing"], failed(flotten), "mobilitaet"],
    ["leihrad", ["Leihräder"], failed(flotten), "mobilitaet"],
    ["passanten", ["Passanten"], !!ID.passant && failed(ID.passant), "mobilitaet"],
    ["oepnv", ["ÖPNV-Verspätung", "ÖPNV"], (abfGestoert || failed(ptStops)) && !zeilen.length, "mobilitaet"],
    ["laden", ["Ladepunkte"], failed(laden), "energie"],
    ["pv", ["PV installiert", "CO₂ vermieden"], failed(ID.pv), "energie"],
  ].map(([key, labels, isFailed, topic]) => ({ key, labels, failed: isFailed, topic })), tileMem);
  // Kacheln nach Relevanz für Bürgerinnen und Bürger ordnen („Sicherheit & Alltag
  // zuerst"): Warnungen und Gesamt-Puls führen als Überblick, dann der tägliche
  // Weg (ÖPNV, Baustellen, Parken), Bürgerservice (Müll, Mängel, Rathaus), Wetter,
  // Umwelt/Gesundheit, Freizeit/Versorgung und zuletzt Energie. Stabiler Sort nach
  // Kachel-Titel; unbekannte Titel behalten ihre Code-Reihenfolge dahinter.
  // Empty "Noch nicht verfügbar" tiles go after every data tile; error tiles
  // ("nicht abrufbar") keep the place of their tile.
  const REL_ORDER = ["Warnungen", "Puls",
    "ÖPNV-Verspätung", "ÖPNV", "Baustellen", "Parken",
    "Müllabfuhr", "Mängel melden", "Rathaus & Bürgerbüro",
    "Temperatur", "Wind", "Luftfeuchte", "UV-Index",
    "Luftqualität", "Feinstaub PM2.5", "NO₂", "Pollenflug", "Hitzebelastung", "Container-Füllstände",
    "Sharing", "Carsharing", "Leihräder", "B+R Fahrradparken", "Passanten",
    "Veranstaltungen", "Ausflugsziele", "Bäder", "Familie & Versorgung",
    "Ladepunkte", "PV installiert", "CO₂ vermieden"];
  const relRank = el => {
    if (el.classList.contains("tile-empty")) return REL_ORDER.length + 1;
    const lblEl = el.querySelector(".label");
    const i = REL_ORDER.indexOf(((lblEl && lblEl.textContent) || "").trim());
    return i === -1 ? REL_ORDER.length : i;
  };
  const host = $("#tiles");
  [...host.children]
    .map((el, i) => [el, relRank(el), i])
    .sort((a, b) => a[1] - b[1] || a[2] - b[2])
    .forEach(([el]) => host.appendChild(el));
  // Detailkarten hinter den Kacheln bekommen dieselben Emoji-Marker wie die Hauptkarte.
  Object.values(D).forEach(def => { if (def && def.kind === "stations") applySymbols(def.groups); });
  SC.wireTileDetails(D);
  // Progressive Enhancement: 24-h-Sparkline in alle Messwert-Kacheln mit Zeitreihe.
  SC.sparkTiles(D);

  // Datenqualitäts-Panel für Rathausmitarbeiter (?daten=1): welche Datenarten
  // liefern für DIESE Gemeinde und wie frisch. Bewusst nicht in der Bürgeransicht.
  if (new URLSearchParams(location.search).get("daten") === "1") {
    const freshMin = e => { const t = obsTime(e); return t ? Math.round((Date.now() - t) / 60000) : null; };
    const first = x => Array.isArray(x) ? x[0] : x;
    const rows = [
      ["Wetter (Open-Meteo)", wx], ["Vorhersage", fcEnt], ["Gemeinde-Puls", pulse],
      ["Feinstaub (Bürgersensoren)", scAlle], ["Luftqualität (UBA)", uba],
      ["Hitzebelastung (DWD)", first(hitzeAll)], ["Pegel", first(pegelListe)], ["Pollenflug", pollenReg],
      ["Parken", pk], ["Sharing", first(sharing)], ["Carsharing", first(csFlotten)],
      ["Ladepunkte", ch], ["Radverkehr", radSum], ["PV/Energie", pv],
      ["Rathaus (OSM)", rathaus], ["Ausflugsziele (OSM)", ausflug],
      ["ÖPNV-Abfahrten", abfahrten && abfahrten.abfahrten ? { dateObserved: { value: abfahrten.stand } } : null],
    ];
    const zeile = ([label, e]) => {
      if (!e) return `<tr><td>${label}</td><td style="color:var(--text-muted)">– keine Daten</td><td></td></tr>`;
      const m = freshMin(e);
      const alt = m == null ? "vorhanden" : m < 60 ? m + " min" : m < 1440 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d";
      const farbe = m == null ? "var(--text-secondary)" : m < 180 ? "var(--status-good)" : m < 1440 ? "var(--status-warn)" : "var(--status-serious)";
      return `<tr><td>${label}</td><td style="color:var(--status-good)">✓ vorhanden</td><td style="color:${farbe}">${alt}</td></tr>`;
    };
    $("#dq").style.display = "block";
    $("#dq").innerHTML = `<div class="card"><h2>Datenqualität — ${esc(name)} (Rathaus-Ansicht)</h2>
      <div class="desc">Frische je Datenart für diese Gemeinde. Grün &lt; 3 h · gelb &lt; 1 Tag · rot älter. Diese Ansicht ist nicht Teil der öffentlichen Bürgerseite (?daten=1).</div>
      <table><thead><tr><th>Datenart</th><th>Status</th><th>Alter</th></tr></thead>
      <tbody>${rows.map(zeile).join("")}</tbody></table></div>`;
  }

  // Interaktive Verläufe direkt auf der Seite (die Detailtiefe der Referenz-
  // seite): jede verfügbare Zeitreihe als sichtbare 24h-Karte, Klick öffnet
  // das Modal mit 24h/48h/7d. Datenarme Städte zeigen automatisch weniger.
  const CHART_TOPIC = { wetter: "wetter", amtlich: "wetter", feinstaub: "umwelt", no2o3: "umwelt", luft: "umwelt",
    sharing: "mobilitaet", br: "mobilitaet", carsharing: "mobilitaet", passanten: "mobilitaet", parken: "mobilitaet",
    radverkehr: "mobilitaet", pv: "energie" };
  // Auf Wunsch von der Seite genommen: Wind (wetter), Feinstaub, NO₂, Sharing
  // (sharing), Radverkehr, PV-Zubau (pv) — sie bleiben als Klick-Detail der Kachel
  // erhalten, erscheinen aber nicht mehr als eigener Verlaufsblock unter den Kacheln.
  const CHART_ORDER = ["br", "carsharing", "passanten", "parken"];
  const inline = CHART_ORDER.filter(k => D[k] && (D[k].kind === "chart" || D[k].kind === "bars" ||
    (D[k].kind === "stations" && (D[k].bars || k === "radverkehr"))));
  $("#charts").innerHTML = inline.map(k =>
    `<div class="card span-4" data-detail="${k}" data-title="${esc(D[k].title)}" data-topic="${CHART_TOPIC[k] || ""}" style="cursor:pointer">
       <h2>${esc(D[k].title)}</h2>
       <div class="desc">${esc(D[k].explain || "")} · Klick: 24 h / 48 h / 7 Tage</div>
       <div class="chart" id="ch-${k}"></div>
     </div>`).join("");
  SC.wireTileDetails(D, "#charts");
  const slot = [css("--series-1"), css("--series-2"), css("--series-3"), css("--series-4"), css("--series-5")];
  await Promise.all(inline.map(async k => {
    const def = D[k];
    if (def.kind === "bars") { barSvg("#ch-" + k, def.rows, { unit: def.unit }); return; }
    if (def.kind === "stations") {
      // Radverkehr: Tagessummen notfalls aus der TRoE-Historie ableiten,
      // wenn der Konnektor last7Days (noch) nicht mitliefert
      if (!def.bars && k === "radverkehr" && radSum) {
        const byDay = {};
        for (const [x, v] of series(await hist(radSum.id, "dailyTotal", 168), "dailyTotal"))
          byDay[new Date(x).toISOString().slice(5, 10).replace("-", ".")] = v;
        const rows = Object.entries(byDay);
        if (rows.length) def.bars = { rows, unit: " Fahrten" };
      }
      barSvg("#ch-" + k, def.bars ? def.bars.rows : [], { unit: def.bars ? def.bars.unit : "" });
      return;
    }
    const ts = await Promise.all(def.series.map(s => hist(s.id, s.attr, 24)));
    if (ts.some(failed)) { $("#ch-" + k).innerHTML = `<div class="desc">${SC.LOAD_ERR_TXT}</div>`; return; }
    chart("#ch-" + k, def.series.map((s, i) => ({ name: s.name, color: slot[i % slot.length], data: series(ts[i], s.attr) })),
      { unit: def.unit, hours: 24, zero: def.zero });
  }));
  SC.loadBanner("#loadwarn", mark);

  // (Der gestapelte »Ladepunkte-Status (live)«-Balken wurde auf Wunsch von der
  //  Seite genommen; die Frei/Belegt/Defekt-Aufteilung steht weiter im Popup der
  //  Ladepunkte-Kartenebene bzw. im Ladepunkte-Detail.)

  // Warn-Banner
  const heads = SC.warnHeads(alertDwd, alertNina);
  const wb = $("#wbanner");
  // Nur bei tatsächlichen Warnungen sichtbar; ohne Warnlage bleibt der Banner leer.
  wb.className = "wbanner " + (heads.length ? (maxSev >= 3 ? "serious" : "warn") : "info");
  wb.style.display = heads.length ? "" : "none";
  wb.innerHTML = SC.warnBannerHtml(heads);

  // Vorhersage-Karte (nur wenn kommunenspezifische Vorhersage vorhanden; Entität oben geladen)
  {
    const days = fcDays;
    if (days.length) {
      $("#fc-card").style.display = "block";
      // Temperatur-Balken relativ zur Wochenspanne: min/max über alle Tage
      const allHi = days.map(x => x[2]), allLo = days.map(x => x[1]);
      const wMin = Math.min(...allLo), wMax = Math.max(...allHi), wSpan = (wMax - wMin) || 1;
      const tempCol = t => `hsl(${Math.round(210 - Math.max(0, Math.min(1, (t - 0) / 32)) * 210)}, 75%, 52%)`;
      $("#fc").innerHTML = days.map(([d, lo, hi, rain, wind, uv, code], i) => {
        const ic = wmoIcon(code);
        const left = ((lo - wMin) / wSpan) * 100, width = Math.max(6, ((hi - lo) / wSpan) * 100);
        return `<div class="day">
          <div class="d-name">${i === 0 ? "Heute" : new Date(d + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short" })}</div>
          <div class="d-ico" title="${ic.label}">${ic.svg}</div>
          <div class="d-temp">${Math.round(hi)}°<span class="lo"> ${Math.round(lo)}°</span></div>
          <div class="d-bar"><span style="left:${left}%;width:${width}%;background:linear-gradient(90deg,${tempCol(lo)},${tempCol(hi)})"></span></div>
          <div class="d-meta">
            <span title="Niederschlag">💧 ${(+rain).toLocaleString("de-DE", { maximumFractionDigits: 1 })} mm</span>
            <span title="Wind">🌬 ${Math.round(wind)}</span>
            <span class="d-uv" style="background:${uv >= 6 ? "var(--status-serious)" : uv >= 3 ? "var(--status-warn)" : "var(--status-good)"}">UV ${Math.round(uv)}</span>
          </div></div>`;
      }).join("");
    }
  }

  // Abfahrtstafel: nutzt dieselbe »zeilen«-Liste wie das ÖPNV-Fahrplan-Detail
  // (weiter oben aus Echtzeit-/Entitätsdaten aufgebaut).
  if (zeilen.length) {
    $("#dep-card").style.display = "block";
    $("#dep-title").textContent = "Abfahrten " + haltName;
    $("#dep-desc").textContent = "Echtzeit (EFA-BW)" + (abfList.length ? " · beim Aufruf abgefragt" : "");
    $("#deps tbody").innerHTML = zeilen.map(d => {
      const dm = d.min;
      const cls = dm == null ? "delay-0" : dm >= 5 ? "delay-s" : dm >= 1 ? "delay-w" : "delay-0";
      return `<tr><td><span class="line-badge">${esc(d.linie)}</span></td><td>${esc(d.ziel)}</td><td>${esc(d.zeit)}</td><td class="num ${cls}" ${dm == null ? 'title="Echtzeitmeldung unplausibel — als unbekannt geführt"' : ""}>${dm == null ? "?" : Number(dm) > 0 ? "+" + Number(dm) : "±0"}</td></tr>`;
    }).join("");
  } else if (abfLeer || (abfGestoert && (abfahrten.halt || tileMem.has("oepnv")))) {
    // "Disturbed" only where a stop is known: the answer names it (502 of the
    // service), or the municipality normally has the ÖPNV tile. A 503 before
    // the stop directory is loaded, or a 429, says nothing about a stop.
    // The stop exists, but there is nothing to list: say why instead of hiding the board.
    $("#dep-card").style.display = "block";
    $("#dep-title").textContent = "Abfahrten" + (haltName ? " " + haltName : "");
    $("#dep-desc").textContent = "Echtzeit (EFA-BW)";
    $("#deps tbody").innerHTML = `<tr><td colspan="4" class="dep-state" style="color:var(--text-secondary)">${abfGestoert ? "Fahrplanauskunft derzeit gestört" : "Derzeit keine Abfahrten"}</td></tr>`;
  } else {
    $("#dep-card").style.display = "none";
  }

  // Baustellen-Liste + Karte
  $("#rw-desc").textContent = failed(kreisRw) ? SC.LOAD_ERR_TXT : rw.length ? "Verkehrsministerium BW (BEMaS) via MobiData BW, Punkt-in-Polygon" : "Keine Baustellen im Gemeindegebiet.";
  $("#rwtable tbody").innerHTML = rw.slice(0, 25).map(e =>
    `<tr><td>${esc(val(e, "name"))}</td><td style="color:var(--text-muted)">${val(e, "endDate") ? "bis " + esc(String(val(e, "endDate")).slice(0, 10)) : ""}</td></tr>`).join("");

  // Karte: eine Gruppe je Datenquelle, per Legende ein-/ausblendbar; Ladestationen
  // tragen ihren Livestatus als Markerfarbe (Detailtiefe der Referenzseite).
  if (!window._map) {
    window._map = L.map("map", { scrollWheelZoom: true }).setView([lat, lon], 12);
    SC.baseLayer(window._map);
    window._groupLayers = {}; window._groupOff = {};
    const toggleGroup = el => {
      const g = el.dataset.group;
      window._groupOff[g] = !window._groupOff[g];
      el.classList.toggle("off", window._groupOff[g]);
      el.setAttribute("aria-pressed", String(!window._groupOff[g]));
      const lg = window._groupLayers[g];
      if (lg) window._groupOff[g] ? window._map.removeLayer(lg) : lg.addTo(window._map);
    };
    $("#map-legend").addEventListener("click", ev => {
      const el = ev.target.closest("[data-group]"); if (el) toggleGroup(el);
    });
    // Karte↔Kachel: „Verlauf/Details ansehen“ in einem Marker-Popup öffnet die
    // zugehörige Detailansicht (Zeitreihe/Karte) — verbindet den räumlichen mit
    // dem zeitlichen Blick.
    $("#map").addEventListener("click", ev => {
      const a = ev.target.closest("a.pop-detail");
      if (a) { ev.preventDefault(); SC.openDetailByKey(a.dataset.detail); }
    });
    // Tastaturbedienung der Ebenen-Umschalter (BITV).
    $("#map-legend").addEventListener("keydown", ev => {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      const el = ev.target.closest("[data-group]");
      if (el) { ev.preventDefault(); toggleGroup(el); }
    });
  }
  const map = window._map;
  // Zentraler ÖPNV-Halt für die Karte: die Deklaration ging beim Umbau auf den
  // On-Demand-Abruf verloren, wodurch »stop« auf window.stop zeigte und der
  // Halt-Marker still verschwand.
  const stop = (ptStops && ptStops[0]) || null;
  const stationPts = [
    stop ? { ...pos(stop), name: val(stop, "name") || "ÖPNV-Knoten" } : null,
    w2 ? { ...pos(w2), name: "DWD-Wetterstation" } : null,
    // extra is markup: upstream text (OSM opening hours – anyone can edit OSM) is escaped.
    ...ubaCands.map(e => ({ ...pos(e), name: "UBA " + (val(e, "stationName") || "Station"), extra: "Luftqualitätsindex: " + (aqiOf(e) == null ? "–" : aqiOf(e) + " (" + AQI_LABEL[aqiOf(e)] + ")") })),
    rathaus ? { ...pos(rathaus), name: val(rathaus, "name") || "Rathaus", extra: esc(val(rathaus, "openingHours") || "") } : null,
  ].filter(i => i && i.lat);
  // Ladepunkte als zwei getrennte, ein-/ausblendbare Ebenen (online/offline).
  const chLadeItems = chList.map(e => { const st = evStatus(e); return { ...pos(e), color: st.color, name: val(e, "name"), online: st.online, legend: st.online ? "online" : "offline",
      extra: esc(String(val(e, "socketNumber") ?? "?") + " Ladepunkte · " + (val(e, "operator") || "")) + "<br>" + st.txt }; }).filter(i => i.lat);
  const groups = [
    // Der Gemeinde-Mittelpunkt ist nur in der Kreisübersicht sinnvoll (dort
    // markiert er die Gemeinden); in der Einzelstadt-Ansicht ist er redundant.
    { name: "Stationen (ÖPNV/Wetter/UBA)", color: MAP_C.stationen, big: true, items: stationPts },
    { name: "Ladepunkte online", color: css("--status-good"), detail: D.laden ? "laden" : null, items: chLadeItems.filter(i => i.online) },
    { name: "Ladepunkte offline", color: css("--text-muted"), detail: D.laden ? "laden" : null, items: chLadeItems.filter(i => !i.online) },
    // Sharing je Anbieter (Roller-Symbol in Markenfarbe); dichte Ebenen starten
    // eingeklappt (DICHT-Schwelle greift wie bei den Ladesäulen).
    ...scooterGroups.map(g => ({ ...g, detail: D.sharing && D.sharing.kind === "stations" ? "sharing" : null })),
    { name: "Carsharing", color: MAP_C.carsharing, detail: D.carsharing ? "carsharing" : null, items: csList.map(e => ({ ...pos(e), name: val(e, "name"),
        extra: csExtra(e) })).filter(i => i.lat) },
    { name: "Leihräder", color: MAP_C.leihrad, items: bikeStations.map(e => ({ ...pos(e), name: val(e, "name"),
        extra: csExtra(e) })).filter(i => i.lat) },
    { name: "B+R Fahrradparken", color: MAP_C.br, detail: D.br ? "br" : null, items: bikes.map(e => ({ ...pos(e), name: val(e, "name"),
        extra: brExtra(e) })).filter(i => i.lat) },
    { name: "Parken", color: MAP_C.parken, detail: D.parken && D.parken.kind === "stations" ? "parken" : null,
      items: parkPts.map(p => ({ lat: p.lat, lon: p.lon, name: p.name, extra: esc(p.extra) })) },
    { name: "Pegel", color: MAP_C.pegel, detail: D.pegel ? "pegel" : null, items: pegelListe.map(e => ({ ...pos(e), name: "Pegel " + (val(e, "name") || ""),
        extra: esc((val(e, "water") || "") + ": " + (val(e, "level") ?? "?") + " cm · " + (val(e, "measuredAt") || "")) })).filter(i => i.lat) },
    { name: "Ausflugsziele", color: MAP_C.ausflug, detail: D.ausflug ? "ausflug" : null, items: ziele.map(z => ({ lat: z[2], lon: z[3], name: z[0], extra: esc(z[1]) })) },
    { name: "Familie & Versorgung", color: "#e11d48", detail: D.versorgung ? "versorgung" : null,
      items: versorgItems.map(z => ({ lat: z[2], lon: z[3], name: z[0], kind: z[1], extra: esc(z[1]) })) },
    { name: "Container-Füllstände", color: css("--status-warn"), detail: D.fuellstand ? "fuellstand" : null,
      items: (D.fuellstand && D.fuellstand.groups[0].items) || [] },
    { name: "Feinstaubsensoren", color: MAP_C.sensoren, detail: D.feinstaub ? "feinstaub" : null, items: luft.filter(e => e.id.includes("bw-sensor-")).map(e => ({ ...pos(e), name: val(e, "name") || "Sensor",
        extra: esc("PM2.5: " + (val(e, "pm25") ?? "–") + " · PM10: " + (val(e, "pm10") ?? "–")) + " µg/m³ (sensor.community)" })).filter(i => i.lat) },
    { name: "Baustellen", color: MAP_C.baustellen, items: rw.map(e => ({ ...pos(e), name: val(e, "name"),
        extra: esc(val(e, "description") || "") + (val(e, "endDate") ? "<br>bis " + esc(String(val(e, "endDate")).slice(0, 10)) : "") })).filter(i => i.lat) },
    { name: "Baustellen Umland (Kreis)", color: MAP_C.umland, items: rwUmland.map(e => ({ ...pos(e), name: val(e, "name"),
        extra: esc(val(e, "gemeindeName") || "") + (val(e, "endDate") ? "<br>bis " + esc(String(val(e, "endDate")).slice(0, 10)) : "") })).filter(i => i.lat) },
    { name: "Radzählstellen", color: MAP_C.rad, items: rad.filter(e => !e.id.endsWith("summary")).map(e => ({ ...pos(e), name: val(e, "name"),
        extra: fmtN(val(e, "dailyTotal")) + " Fahrten" + (dObs(e) ? " am " + fmtDay(dObs(e)) : "") })).filter(i => i.lat) },
  ].filter(g => g.items.length);
  Object.values(window._groupLayers).forEach(l => map.removeLayer(l));
  window._groupLayers = {};
  // Sehr dichte Ebenen (z. B. hunderte Ladesäulen in der Großstadt) beim ersten
  // Laden eingeklappt zeigen, damit die Karte nicht zugedeckt startet — Anzahl
  // steht in der Legende, ein Klick blendet sie ein. Kleine Orte bleiben
  // unberührt (unter der Schwelle). Nur einmalig, danach entscheidet der Nutzer.
  const DICHT = 80;
  if (!window._legendSeeded) {
    groups.forEach(g => { if (!g.big && g.items.length > DICHT) window._groupOff[g.name] = true; });
    window._legendSeeded = true;
  }
  const eingeklappt = groups.filter(g => window._groupOff[g.name]);
  // Legende = Symbol-Filter: das jeweilige Symbol vorweg, klickbar zum Ein-/Ausblenden.
  $("#map-legend").innerHTML = groups.map((g, i) =>
    `<span data-group="${esc(g.name)}" role="button" tabindex="0" aria-pressed="${!window._groupOff[g.name]}" class="leg-item ${window._groupOff[g.name] ? "off" : ""}" title="Ein-/Ausblenden">` +
    `<span class="leg-sym">${groupIcon(g)}</span>${esc(g.name)} (${g.items.length})</span>`).join("");
  // Deckungsgleiche Marker entzerren: An einem Sammelpunkt (≈11 m Raster) werden
  // mehrere Pins im Kreis aufgefächert — nach dem goldenen Winkel, damit auch
  // dichte Stapel (Ladesäulen/Sensoren in der Innenstadt) gleichmäßig streuen
  // statt sich zu überdecken. Der Längengrad-Versatz wird um 1/cos(lat)
  // gestreckt, damit der Fächer rund bleibt statt oval.
  const seenPos = {};
  const lonStretch = 1 / Math.cos(lat * Math.PI / 180);
  const spread = it => {
    const k = it.lat.toFixed(4) + "/" + it.lon.toFixed(4);
    const n = seenPos[k] = (seenPos[k] || 0) + 1;
    if (n === 1) return [it.lat, it.lon];
    const ring = Math.ceil(Math.sqrt(n));            // wachsender Radius je Ring
    const ang = n * 2.399963;                        // goldener Winkel ≈ 137,5°
    const r = 0.00055 * ring;
    return [it.lat + r * Math.cos(ang), it.lon + r * lonStretch * Math.sin(ang)];
  };
  applySymbols(groups);
  groups.forEach((g, i) => {
    const lg = L.layerGroup();
    g.items.forEach(it =>
      L.marker(spread(it), { icon: SC.markerIcon(it.color || groupColor(g, i), symFor(g, it), g.big), keyboard: false })
        .bindPopup(popupHtml(g, it)).addTo(lg));
    window._groupLayers[g.name] = lg;
    if (!window._groupOff[g.name]) lg.addTo(map);
  });
  // Markers from OpenStreetMap (Ausflugsziele, Familie & Versorgung, Rathaus):
  // the ODbL credit joins the map's credit line while any of them is shown.
  const osmShown = !!rathaus || groups.some(g => g.name === "Ausflugsziele" || g.name === "Familie & Versorgung");
  if (map.attributionControl) {
    if (osmShown && !window._osmCredit) { map.attributionControl.addAttribution(SC.OSM_CREDIT); window._osmCredit = true; }
    if (!osmShown && window._osmCredit) { map.attributionControl.removeAttribution(SC.OSM_CREDIT); window._osmCredit = false; }
  }
  $("#mapdesc").textContent = "Standorte aller eingebundenen Datenquellen — Legende klickbar zum Ein-/Ausblenden."
    + (eingeklappt.length ? " Dichte Ebenen (" + eingeklappt.map(g => g.name).join(", ") + ") sind zunächst ausgeblendet." : "");

  // Footer: attribution from the registry. Embedded, the source credits stay
  // visible; the navigation links (.footer-nav) do not.
  $("#footer").innerHTML = "Datenquellen: " + SC.attributionHtml(CONN) + " · " + SC.MAP_CREDIT +
    "<span class='footer-nav'> · <a href='/'>Kommunen-Suche</a>" +
    (dashUrl && dashUrl.startsWith("http") ? ` · <a href="${esc(safeUrl(dashUrl))}" target="_blank" rel="noopener">Eigenes Angebot der Kommune</a>` : "") + "</span>";

  $("#stand").textContent = "Stand: " + new Date().toLocaleTimeString("de-DE") + " · Auto-Refresh 120 s";
}

(async () => {
  try {
    const qp = new URLSearchParams(location.search);
    if (qp.get("embed") === "1") {
      document.body.classList.add("embed");
      // Embedded in another site: links to other pages open in a new tab
      // instead of replacing the dashboard inside the frame.
      document.addEventListener("click", ev => {
        const a = ev.target.closest && ev.target.closest("a[href]");
        if (a && !a.target && /^https?:/.test(a.href) && !a.getAttribute("href").startsWith("#")) {
          a.target = "_blank"; a.rel = "noopener";
        }
      });
    }
    if (qp.get("kiosk") === "1") startKiosk();
    // Die generierten Seiten inlinen die Gemeindezeile + amtliche Website in
    // window.STADT — dann entfallen die großen Kataloge (162 KB) je Aufruf.
    // Nur beim manuellen Zugriff (?ags=/Slug ohne Inline-Zeile) nachladen.
    const inlineRow = STADT && Array.isArray(STADT.row) ? STADT.row : null;
    const [conn, dash] = await Promise.all([
      jget("/connectors-status.json").catch(() => ({ connectors: [] })),
      jget("/dashboards.json").catch(() => ({})),
    ]);
    CONN = conn.connectors || []; DASH = dash.kommunen || dash || {};
    let row = inlineRow;
    if (inlineRow && STADT.website != null) SERVICES = { [inlineRow[0]]: { website: STADT.website } };
    if (!row) {
      // Fallback ohne Inline-Zeile: Kataloge laden und Zeile auflösen.
      const [gdata, services] = await Promise.all([
        jget("/bw-gemeinden.json"),
        jget("/gemeinde-services.json").catch(() => ({ dienste: {} })),
      ]);
      GEM = gdata.gemeinden; SERVICES = services.dienste || {};
      GEM.forEach(g => { BY_AGS[g[0]] = g; BY_SLUG[g[8]] = g; });
      const p = new URLSearchParams(location.search);
      row = (STADT && STADT.ags && BY_AGS[STADT.ags]) ||
            BY_AGS[p.get("ags")] || BY_SLUG[location.pathname.replace(/^\/|\/$/g, "")];
    }
    if (!row) throw new Error("Kommune nicht gefunden");
    STADT = { ags: row[0], row, website: STADT && STADT.website };
    const cfg0 = (DASH[row[8]] || {});
    SC.themeSelector("#thememount", cfg0.branding && cfg0.branding.theme);
    // One render at a time: a refresh while a slow render still runs is
    // skipped, so requests and the banner's failure count do not mix.
    let rendering = null;
    const renderOnce = () => rendering || (rendering = render().finally(() => { rendering = null; }));
    document.addEventListener("sc-theme-changed", () => { window._map && renderOnce().catch(() => {}); });
    await renderOnce();
    // Hidden tabs skip the refresh and catch up once visible again.
    SC.autoRefresh(renderOnce, 120e3, () => !SC.modalOpen());
  } catch (e) {
    const el = $("#err"); el.textContent = "Fehler beim Laden: " + e.message; el.style.display = "block";
  }
})();
</script>
</body>
</html>
