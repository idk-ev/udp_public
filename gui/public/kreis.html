<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreis-Dashboard</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/smartcity-theme.css">
<style>
  /* Seitenspezifisch (Basis kommt aus smartcity-theme.css) */
  #map { height: 460px; }
  .disclaimer { font-size: .78rem; color: var(--text-muted); margin: -8px 0 14px; }
  td a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
  td a:hover { color: var(--accent); }
</style>
<meta name="theme-color" content="#0074e8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon">
</head>
<body>
<header>
  <span class="udp-logo" data-udp-logo hidden></span>
  <h1 id="title">Kreis</h1>
  <span class="sub" id="subtitle"></span>
  <span class="stand" id="stand">lädt…</span>
  <span id="thememount"></span>
</header>
<div id="err"></div>
<div class="loadwarn" id="loadwarn" role="status"></div>
<div class="disclaimer">Kreissicht aus offenen Daten — aggregiert über alle Gemeinden des Kreises. Jede Gemeinde hat ein eigenes Dashboard.</div>
<div class="wbanner" id="wbanner"></div>

<div class="tiles" id="tiles"></div>

<div class="grid">
  <div class="card span-6">
    <h2 id="gem-title">Gemeinden</h2>
    <div class="desc">Klick öffnet das Gemeinde-Dashboard</div>
    <div style="max-height:460px;overflow-y:auto">
      <table id="gems"><thead><tr><th>Gemeinde</th><th class="num">Einwohner</th><th class="num">Puls</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
  <div class="card span-6">
    <h2>Karte</h2>
    <div class="desc">Gemeinden des Kreises — Popup verlinkt aufs Dashboard</div>
    <div id="map"></div>
  </div>
</div>

<footer id="footer"></footer>
<nav class="legal-links" data-udp-legal aria-label="Rechtliches" hidden></nav>

<script src="/config.js"></script>
<script src="/site.js"></script>
<script src="/vendor/leaflet.js"></script>
<script src="/smartcity-lib.js"></script>
<script>
"use strict";
const { $, css, esc, val, asArray, jget, jlist, entity, tile, errorTile, failed, sharingSplit, fmtN } = SC;

let KREIS = window.KREIS || null, CONN = [];

// Registry keys ("provides", connectors-status.json) behind each tile: the
// footer credits exactly the sources whose data the page shows. The pulse is
// a derived index; its inputs are credited with it (puls-bw.ts).
const TILE_SOURCES = {
  puls: ["warnungen", "baustellen", "luft-uba", "feinstaub", "departures", "br", "sharing", "laden"],
  warnungen: ["warnungen"], baustellen: ["baustellen"], pv: ["pv"], laden: ["laden"],
  parken: ["parken"], sharing: ["sharing"], radverkehr: ["radverkehr"],
};
// Names, population and positions of the municipalities (bw-gemeinden.json).
const BASE_SOURCES = ["stammdaten-bw"];
const sourcesFor = shown => {
  const keys = new Set(shown.flatMap(t => TILE_SOURCES[t] || []));
  return CONN.filter(c => BASE_SOURCES.includes(c.id) || (c.provides || []).some(p => keys.has(p)));
};

// Regex-Query: alle Entitäten eines Typs, deren ags mit dem Kreisschlüssel beginnt
const byKreis = (type, krs) =>
  jlist(`${SC.GW}/ngsi-ld/v1/entities?type=${type}&q=ags~%3D%5E${krs}&limit=200&options=keyValues`);
const sum = (list, attr) => list.reduce((s, e) => s + (Number(e[attr]) || 0), 0);

async function render(krow, members) {
  const [krs, name, lat, lon, typ, gemCount, ew] = krow;
  const anzeigeName = typ === "SK" ? "Stadtkreis " + name : /kreis$/i.test(name) ? name : "Landkreis " + name;
  document.title = `${anzeigeName} — Live-Dashboard`;
  $("#title").textContent = anzeigeName;
  $("#subtitle").textContent = `${gemCount} ${gemCount === 1 ? "Gemeinde" : "Gemeinden"} · ${fmtN(ew)} Einwohner`;
  $("#gem-title").textContent = gemCount === 1 ? "Gemeinde" : `Gemeinden (${gemCount})`;

  // Entity ids, also for SC.failed(id): a failed query is not "no data".
  const ID = { dwd: "urn:ngsi-ld:Alert:bw-kreis-" + krs + "-dwd", nina: "urn:ngsi-ld:Alert:bw-kreis-" + krs + "-nina",
    rw: "urn:ngsi-ld:RoadWork:bw-kreis-" + krs + "-summary" };
  const mark = SC.loadMark();
  const [alertDwd, alertNina, rwSum, pulse, pv, laden, parken, sharing, rad] = await Promise.all([
    entity(ID.dwd), entity(ID.nina), entity(ID.rw),
    byKreis("CityPulse", krs), byKreis("EnergyMonitor", krs), byKreis("ChargingSummary", krs),
    byKreis("ParkingSummary", krs), byKreis("SharingSummary", krs), byKreis("TrafficFlowObserved", krs),
  ]);

  const warnCount = (val(alertDwd, "activeCount") || 0) + (val(alertNina, "activeCount") || 0);
  const maxSev = Math.max(val(alertDwd, "maxSeverity") || 0, val(alertNina, "maxSeverity") || 0);
  // Only current pulses (hourly connector, at most 3 h old). keyValues renders
  // dateObserved as string or { "@type", "@value" }; without it a pulse is an
  // old one from before the timestamp was added and not counted.
  const kvZeit = e => { const v = e && e.dateObserved; const t = Date.parse(v && typeof v === "object" ? v["@value"] : v); return isFinite(t) ? t : 0; };
  const pulseAktuell = pulse.filter(e => Date.now() - kvZeit(e) <= 3 * 3600e3);
  const pulsVals = pulseAktuell.filter(e => e.pulseIndex != null);
  const pulsAvg = pulsVals.length ? Math.round(sum(pulsVals, "pulseIndex") / pulsVals.length) : null;
  const radSums = rad.filter(e => String(e.id).endsWith("-summary"));

  // Farbstufen des Puls-Tachos (wie in der Gemeindeansicht: rot < 50 < gelb < 75 < grün);
  // flip:true dreht die Skala, damit wie überall Grün links und Rot rechts steht.
  const PULS_STOPS = [[0, 50, "var(--status-serious)"], [50, 75, "var(--status-warn)"], [75, 100, "var(--status-good)"]];
  let tiles = "";
  if (pulsAvg != null)
    tiles += tile("Puls Ø", pulsAvg, "/100", { status: pulsAvg >= 75 ? css("--status-good") : pulsAvg >= 50 ? css("--status-warn") : css("--status-serious"),
      mini: { v: pulsAvg, min: 0, max: 100, stops: PULS_STOPS, flip: true },
      hint: pulsVals.length + " Gemeinden", explain: "Mittelwert des Zustandsindex (0–100, höher = besser) über alle Gemeinden mit Puls-Daten." });
  // Warnungen stand on every page: a failed query shows the error state, not 0.
  tiles += failed(ID.dwd) || failed(ID.nina) ? errorTile("Warnungen") : tile("Warnungen", warnCount, "", { status: warnCount === 0 ? css("--status-good") : maxSev >= 3 ? css("--status-serious") : css("--status-warn"),
    hint: "DWD + NINA, kreisweit", explain: "Amtliche Warnungen gelten auf Kreisebene (DWD-Wetterwarnungen und NINA-Bevölkerungsschutz)." });
  if (val(rwSum, "activeCount") != null)
    tiles += tile("Baustellen", val(rwSum, "activeCount"), "", { hint: "im Kreisgebiet (SVZ-BW)",
      explain: "Aktive Baustellen im gesamten Kreisgebiet laut Straßenverkehrszentrale BW." });
  if (pv.length)
    tiles += tile("PV installiert", (sum(pv, "installedCapacityKw") / 1000).toFixed(1).replace(".", ","), "MW",
      { hint: fmtN(sum(pv, "plantCount")) + " Anlagen (MaStR)", explain: "Photovoltaik-Gesamtleistung aller Gemeinden laut Marktstammdatenregister." });
  if (laden.length)
    tiles += tile("Ladepunkte", fmtN(sum(laden, "evseCount")), "", { hint: fmtN(sum(laden, "locationCount")) + " Standorte",
      explain: "E-Ladepunkte im Kreis laut BNetzA-Register." });
  if (parken.length) {
    // Free spaces where the realtime sum is current (dateObserved at most 6 h
    // old, as on the municipality page); else the capacity, labelled "Stellplätze".
    const parkLive = parken.filter(e => e.realtimeFree != null && Date.now() - kvZeit(e) <= 6 * 3600e3);
    const cap = fmtN(sum(parken, "totalCapacity")), anl = fmtN(sum(parken, "siteCount")) + " Anlagen";
    tiles += parkLive.length
      ? tile("Parken", fmtN(sum(parkLive, "realtimeFree")), "frei", { status: css("--status-good"),
          hint: "in " + fmtN(sum(parkLive, "realtimeSites")) + " Anlagen mit Echtzeit · " + cap + " Stellplätze",
          explain: "Freie Plätze der Anlagen mit Echtzeit-Belegung im Kreis; insgesamt " + cap + " Stellplätze in " + anl + " (MobiData BW)." })
      : tile("Parken", cap, "Stellplätze", { hint: anl + " · ohne Echtzeit",
          explain: "Stellplätze aller in MobiData BW erfassten Anlagen im Kreis." });
  }
  if (sharing.length) {
    // Free floating, split by form factor; older summaries without the split:
    // the total only.
    const split = sharingSplit(sharing.map(e => [e.availableVehicles, e.vehiclesByFormFactor]));
    const withSplit = !!(split.parts && split.parts.length);
    tiles += tile("Sharing", fmtN(split.total), "", { hint: withSplit ? esc(split.text) : "verfügbare Leihfahrzeuge",
      explain: "Aktuell verfügbare Leihfahrzeuge frei flottierender Anbieter (GBFS) im Kreis" + (withSplit ? ": " + split.text : "") + ". An Stationen stationsgebundener Anbieter abgestellte Räder und Autos zählen nicht mit." });
  }
  if (radSums.length)
    tiles += tile("Radverkehr", fmtN(sum(radSums, "dailyTotal")), "", { hint: fmtN(sum(radSums, "siteCount")) + " Zählstellen",
      explain: "Radfahrten am letzten verfügbaren Tag über alle Zählstellen im Kreis (Eco-Counter)." });
  $("#tiles").innerHTML = tiles;
  // Optional tiles whose query failed: error state where this district
  // normally has the tile (remembered from earlier views), nothing otherwise.
  const tileMem = window._tileMem || (window._tileMem = SC.tileMemory("kreis:" + krs));
  SC.errorTiles("#tiles", [
    ["puls", ["Puls Ø"], failed(pulse)], ["baustellen", ["Baustellen"], failed(ID.rw)],
    ["pv", ["PV installiert"], failed(pv)], ["laden", ["Ladepunkte"], failed(laden)],
    ["parken", ["Parken"], failed(parken)], ["sharing", ["Sharing"], failed(sharing)],
    ["rad", ["Radverkehr"], failed(rad)],
  ].map(([key, labels, isFailed]) => ({ key, labels, failed: isFailed })), tileMem);
  SC.loadBanner("#loadwarn", mark);

  // Warn-Banner
  const heads = [];
  for (const [q, a] of [["DWD", alertDwd], ["NINA", alertNina]])
    for (const h of asArray(val(a, "headlines"))) heads.push(`<b>${q}</b>: ${esc(h.h || h)}`);
  const wb = $("#wbanner");
  wb.className = "wbanner" + (heads.length ? (maxSev >= 3 ? " serious" : " warn") : "");
  wb.innerHTML = heads.join("<br>");

  // Gemeinde-Tabelle (Puls je Gemeinde, sofern vorhanden)
  const pulsByAgs = {};
  pulseAktuell.forEach(e => { if (e.ags) pulsByAgs[e.ags] = e.pulseIndex; });
  $("#gems tbody").innerHTML = members
    .slice().sort((a, b) => (b[6] || 0) - (a[6] || 0))
    .map(g => `<tr><td><a href="/${encodeURIComponent(g[8])}">${esc(g[1])}</a></td><td class="num">${fmtN(g[6])}</td>
      <td class="num">${Number.isFinite(Number(pulsByAgs[g[0]])) ? Number(pulsByAgs[g[0]]) : "–"}</td></tr>`).join("");

  // Karte
  if (!window._map) {
    window._map = L.map("map", { scrollWheelZoom: true }).setView([lat, lon], 10);
    SC.baseLayer(window._map);
    window._layers = L.layerGroup().addTo(window._map);
  }
  window._layers.clearLayers();
  members.forEach(g =>
    L.circleMarker([g[2], g[3]], { radius: 6, weight: 1.5, color: css("--surface-1"), fillColor: css("--series-1"), fillOpacity: 1 })
      .bindPopup(`<b>${esc(g[1])}</b><br>${fmtN(g[6])} Einwohner<br><a href="/${encodeURIComponent(g[8])}">Dashboard öffnen →</a>`)
      .addTo(window._layers));

  // Source credits (CC BY / dl-de/by-2-0 require them where the data is
  // shown): the connectors behind the tiles on the page, warnings always.
  const shown = ["warnungen", pulsAvg != null && "puls", val(rwSum, "activeCount") != null && "baustellen",
    pv.length && "pv", laden.length && "laden", parken.length && "parken", sharing.length && "sharing",
    radSums.length && "radverkehr"].filter(Boolean);
  $("#footer").innerHTML = "Kreissicht der Urbanen Datenplattform · Datenquellen: " +
    esc(SC.attributions(sourcesFor(shown)).join(" · ")) + " · " + SC.MAP_CREDIT + " · <a href='/'>Kommunen-Suche</a>";
  $("#stand").textContent = "Stand: " + new Date().toLocaleTimeString("de-DE") + " · Auto-Refresh 120 s";
}

(async () => {
  try {
    const [gdata, conn] = await Promise.all([
      jget("/bw-gemeinden.json"),
      jget("/connectors-status.json").catch(() => ({ connectors: [] })),
    ]);
    CONN = conn.connectors || [];
    const slug = (KREIS && KREIS.slug) || location.pathname.replace(/^\/|\/$/g, "");
    const krow = (gdata.kreise || []).find(k => k[7] === slug || (KREIS && k[0] === KREIS.krs));
    if (!krow) throw new Error("Kreis nicht gefunden");
    const members = gdata.gemeinden.filter(g => g[4] === krow[0]);
    SC.themeSelector("#thememount");
    // One render at a time: a refresh while a slow render still runs is
    // skipped, so requests and the banner's failure count do not mix.
    let rendering = null;
    const renderOnce = () => rendering || (rendering = render(krow, members).finally(() => { rendering = null; }));
    document.addEventListener("sc-theme-changed", () => { window._layers && renderOnce().catch(() => {}); });
    await renderOnce();
    // Hidden tabs skip the refresh and catch up once visible again.
    SC.autoRefresh(renderOnce, 120e3);
  } catch (e) {
    const el = $("#err"); el.textContent = "Fehler beim Laden: " + e.message; el.style.display = "block";
  }
})();
</script>
</body>
</html>
