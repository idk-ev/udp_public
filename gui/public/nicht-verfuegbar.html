<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht verfügbar — Urbane Datenplattform</title>
<link rel="icon" href="/favicon">
<link rel="stylesheet" href="/smartcity-theme.css">
<style>
  main { max-width: 640px; margin: 8vh auto 0; text-align: center; }
  p { color: var(--text-secondary); margin: 12px 0 22px; }
  .go { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
        padding: 11px 20px; border-radius: 10px; font-weight: 600; }
  .legal-links { justify-content: center; margin-top: 8vh; }
</style>
</head>
<body>
<main>
  <h1>Diese Seite ist nicht verfügbar</h1>
  <p>Unter dieser Adresse steht zurzeit kein Dashboard zur Verfügung.</p>
  <a class="go" id="go" href="/">Zur Kommunen-Suche →</a>
</main>
<nav class="legal-links" data-udp-legal aria-label="Rechtliches" hidden></nav>
<script src="/config.js"></script>
<script src="/site.js"></script>
<script>
"use strict";
/* Where to go instead: the district's page, if the published list names one for this
   address. Without JavaScript, or on any error, the link stays on the start page. */
(async () => {
  try {
    const list = await (await fetch("/city-blocks.json", { headers: { Accept: "application/json" } })).json();
    const slug = location.pathname.replace(/^\/(?:g\/)?/, "").replace(/\/(?:index\.html)?$/, "");
    const ags = new URLSearchParams(location.search).get("ags");
    const entry = (list.blocked || []).find(e => e.slug === slug || (ags && e.ags === ags));
    if (entry && /^[a-z0-9-]+$/.test(entry.kreisSlug || "") && typeof entry.kreisName === "string") {
      const go = document.getElementById("go");
      go.href = "/" + entry.kreisSlug;
      go.textContent = "Zum " + entry.kreisName + " →";
    }
  } catch { /* the start page it is */ }
})();
</script>
</body>
</html>
