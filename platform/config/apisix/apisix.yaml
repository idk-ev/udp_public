# =============================================================================
# API-Management der Urbanen Datenplattform (LB B.II.4)
# Alle Plattform-Schnittstellen werden zentral, dokumentiert und kontrolliert
# über das Gateway bereitgestellt. Zugriffskontrolle: Keycloak (OIDC) –
# Aktivierung der openid-connect-Plugins pro Route, siehe docs/betrieb.md.
# =============================================================================

global_rules:
  - id: cors-all
    plugins:
      cors:
        allow_origins: "*"
        # Gleichstand mit dem Chart (helm/udp/files/apisix/apisix.yaml.tpl):
        # nur lesende Methoden, solange die Routen kein OIDC-Token auswerten.
        # Betrifft nur Cross-Origin-Aufrufe aus dem Browser — lokale Tests per
        # curl gegen den Broker sind davon unberührt.
        allow_methods: "GET,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
      prometheus: {}

upstreams:
  - id: orion
    nodes:
      "orion-ld:1026": 1
    type: roundrobin
  - id: mintaka
    nodes:
      "mintaka:8080": 1
    type: roundrobin
  - id: frost
    nodes:
      "frost:8080": 1
    type: roundrobin
  - id: iot-agent
    nodes:
      "iot-agent-json:4041": 1
    type: roundrobin
  - id: iot-http
    nodes:
      "iot-agent-json:7896": 1
    type: roundrobin
  - id: ckan
    nodes:
      "ckan:5000": 1
    type: roundrobin
  - id: geoserver
    nodes:
      "geoserver:8080": 1
    type: roundrobin
  - id: masterportal
    nodes:
      "masterportal:80": 1
    type: roundrobin

routes:
  # NGSI-LD Context Broker (Echtzeit-Kontextdaten)
  - id: ngsi-ld
    uris: ["/ngsi-ld/*"]
    upstream_id: orion
    plugins:
      limit-req:
        rate: 200
        burst: 100
        key: remote_addr

  # NGSI-LD Temporal API (Zeitreihenabfragen)
  - id: temporal
    uris: ["/temporal/*"]
    upstream_id: mintaka
    plugins:
      proxy-rewrite:
        regex_uri: ["^/temporal/(.*)", "/$1"]

  # OGC SensorThings API
  - id: sensorthings
    uris: ["/FROST-Server/*"]
    upstream_id: frost

  # IoT-Geräteprovisionierung (Admin) – in Produktion OIDC-geschützt
  - id: iot-provisioning
    uris: ["/iot/*"]
    upstream_id: iot-agent
    plugins:
      proxy-rewrite:
        regex_uri: ["^/iot/(.*)", "/iot/$1"]

  # IoT-HTTP-Ingest (Sensoren → Plattform)
  - id: iot-ingest
    uris: ["/ingest/*"]
    upstream_id: iot-http
    plugins:
      proxy-rewrite:
        regex_uri: ["^/ingest/(.*)", "/iot/$1"]
      limit-req:
        rate: 500
        burst: 200
        key: remote_addr

  # Open-Data-Katalog (CKAN, DCAT-AP.de)
  - id: open-data
    uris: ["/catalog/*"]
    upstream_id: ckan
    plugins:
      proxy-rewrite:
        regex_uri: ["^/catalog/(.*)", "/$1"]

  # OGC WMS/WFS/WPS (GeoServer, nativer Kontextpfad /geoserver)
  - id: geo
    uris: ["/geoserver/*"]
    upstream_id: geoserver

  # Masterportal (statisches Geoportal, Profil viz-extra)
  - id: masterportal
    uris: ["/portal", "/portal/*"]
    upstream_id: masterportal
    plugins:
      proxy-rewrite:
        regex_uri: ["^/portal/?(.*)", "/$1"]
#END
